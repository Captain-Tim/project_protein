<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 單獨加到主畫面時也有圖示可用(與 Monkey 共用一張)。 -->
<link rel="apple-touch-icon" href="icons/monkey-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="🍗 Wallet" />
<meta name="theme-color" content="#070708" />
<title>Fried Chicken Wallet — Monkey</title>
<style>
  /* 主題 token 由 build 從 dashboard-monkey.html 複製過來,請勿手改 START/END 之間 */
  /*THEME_START*/:root {
    --bg: #070708; --card: #111214; --border: #212328;
    --ink: #e9ecef; --muted: #7f858e;
    --accent: #c9f24d; --accent-dim: #7fae35;
    --person: #ff3b3b;
    --streak: #ffb648; --streak-bg: #1a1408; --streak-border: #4a3a12;
    --pos: #34d399; --neg: #f87171;                     /* 漲跌:▲ 進步=綠、▼ 退步=紅 */
    --hm0: #17191c; --hm1: #2f4419; --hm2: #5f8a26; --hm3: #c9f24d;
  }/*THEME_END*/
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px; min-width: 0; }
  .lbl { font-size: 10px; letter-spacing: 1.1px; color: var(--muted); font-weight: 600; }
  .num { font-family: Consolas, ui-monospace, monospace; font-weight: 700; }
  .lime { color: var(--accent); }

  header.hero {
    background: radial-gradient(600px 120px at 8% -30%, rgba(255, 59, 59, .25), transparent), #0d0e10;
    border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px;
  }
  .back { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--muted);
    text-decoration: none; }
  .back:hover { color: var(--ink); }
  .who { font-size: 19px; font-weight: 800; letter-spacing: .5px; margin-top: 6px; }

  .tabs { display: flex; gap: 6px; margin: 16px 2px 0; }
  .tab { font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
    padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); transition: color .15s, border-color .15s, box-shadow .15s; }
  .tab:hover { color: var(--ink); border-color: var(--accent-dim); }
  .tab.on { color: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 12px rgba(201, 242, 77, .25); }

  /* 炸雞券:一張一列,🍗 票根與內容之間一條虛線(票券的撕線) */
  .cpnList { display: grid; gap: 8px; margin-top: 12px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .cpn { position: relative; display: flex; align-items: center; gap: 6px; padding-right: 10px;
    border-radius: 26px; background: var(--card);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .cpn .stub { flex: 0 0 44px; align-self: stretch; display: flex; align-items: center;
    justify-content: center; font-size: 19px;
    border-right: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); }
  .cpn .body { flex: 1 1 auto; min-width: 0; overflow: hidden; padding: 11px;
    display: flex; align-items: center; gap: 8px; }
  /* 日期不能被 note 擠到換行,要縮的是 note */
  .cpn .body .lbl, .cpn .body .num { white-space: nowrap; flex: 0 0 auto; }
  /* 已使用:整列灰掉,右邊蓋一枚紅框戳記 */
  .cpn.used { filter: grayscale(.7); }
  .cpn.used .body { opacity: .55; }
  .cpn .stamp { flex: 0 0 auto; font-family: Consolas, ui-monospace, monospace;
    font-size: 9px; font-weight: 800; letter-spacing: .8px; white-space: nowrap;
    padding: 3px 8px; border: 2px solid #ff5a5a; border-radius: 4px; color: #ff5a5a; }
  .cpn .note { font-size: 11px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  /* 特別券:人工核發的,用金色跟達標券(綠)分開,並掛一枚 SPECIAL 讓來源一眼看得出來 */
  .cpn.special { border-color: color-mix(in srgb, var(--streak) 55%, var(--border)); }
  .cpn.special .stub { border-right-color: color-mix(in srgb, var(--streak) 60%, transparent); }
  /* 徽章是 .cpn 的直接子元素(不在 .body 裡),.body 撐開後它自然貼在最右邊、USED 戳記之前 */
  .cpn.used .badge { opacity: .55; }
  .cpn .badge { flex: 0 0 auto; font-family: Consolas, ui-monospace, monospace;
    font-size: 9px; font-weight: 800; letter-spacing: .8px; white-space: nowrap;
    padding: 2px 7px; border-radius: 999px; color: var(--streak);
    border: 1px solid color-mix(in srgb, var(--streak) 55%, transparent); background: var(--streak-bg); }

  /* 今天剛拿到的券:外圍光暈一亮一暗,券本身完全不動。
     顏色跟著券自己走——達標券綠、特別券金,不要硬寫死一種。
     CSS 沒有「每次重複之間留白」這種屬性,所以停頓做進 keyframes 的百分比:
     上升 1200ms(→41.38%)、下降 900ms(→72.41%),剩下的 800ms 全暗。 */
  .cpn { --glow: 201, 242, 77; }
  .cpn.special { --glow: 255, 182, 72; }
  @keyframes couponGlow {
    0%     { box-shadow: 0 0 0 0 rgba(var(--glow), 0); }
    41.38% { box-shadow: 0 0 61px 11px rgba(var(--glow), .5); }
    72.41% { box-shadow: 0 0 0 0 rgba(var(--glow), 0); }
    100%   { box-shadow: 0 0 0 0 rgba(var(--glow), 0); }
  }
  .cpn.fresh { animation: couponGlow 2900ms linear infinite; }

  /* 使用一張券:USED 戳記從大縮小砸下,券跟著震一下。
     這只是演出——ledger 沒動,重新整理就回到可用。真正生效要跑 use-coupon。 */
  .cpn.tapable { cursor: pointer; }
  @keyframes couponSlam {
    0%   { opacity: 0; transform: scale(4.32) rotate(-26deg); }
    65%  { opacity: 1; transform: scale(.9) rotate(-6deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes couponJolt {
    0%, 100% { transform: translateX(0); }
    30%      { transform: translateX(-7px); }
    70%      { transform: translateX(7px); }
  }
  .cpn.go { animation: couponJolt 260ms ease-out 234ms both; }
  .cpn.go .stamp { animation: couponSlam 312ms cubic-bezier(.3, 1.5, .5, 1) both; }

  /* 就地確認:券上直接浮出 USE? */
  .ask { position: absolute; inset: 0; border-radius: inherit; display: flex; align-items: center;
    justify-content: center; gap: 10px; background: rgba(10, 11, 12, .82);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    font-size: 11px; font-weight: 800; letter-spacing: 1px; animation: askIn .16s ease-out; }
  @keyframes askIn { from { opacity: 0; } to { opacity: 1; } }
  .ask button { font: inherit; font-size: 12px; cursor: pointer; border-radius: 99px;
    padding: 3px 12px; background: transparent; }
  .ask .yes { color: #0a0b0c; background: var(--accent); border: 1px solid var(--accent); }
  .ask .no { color: var(--muted); border: 1px solid var(--border); }

  @media (prefers-reduced-motion: reduce) {
    .cpn.fresh, .cpn.go, .cpn.go .stamp, .ask { animation: none; }
  }

  #empty { font-size: 12px; color: var(--muted); margin-top: 16px; text-align: center;
    padding: 24px 0; }

  #dataErrors { margin-top: 24px; font-size: 12px; color: #ff8a8a;
    border: 1px solid #4a1414; background: #1a0c0c; border-radius: 12px; padding: 10px 14px; }
  #dataErrors:empty { display: none; }

  @media (max-width: 640px) {
    .cpnList { grid-template-columns: 1fr; }
  }
</style>
</head>

<div class="wrap">

<script>
/* 資料由 build 腳本注入此標記區塊,請勿手改 START/END 之間 */
/*WORKOUT_DATA_START*/window.WORKOUT_DATA={"sessions":[{"date":"2026-07-07","type":"Cardio","strength":[],"cardio":[{"exercise":"Running","duration_min":30,"distance_km":3.1}],"note":null},{"date":"2026-07-12","type":"Cardio","strength":[],"cardio":[{"exercise":"Running","duration_min":30,"distance_km":3,"avg_hr_bpm":140}],"note":null},{"date":"2026-07-18","type":"Cardio","strength":[],"cardio":[{"exercise":"Running","duration_min":45,"distance_km":4.65}],"note":null},{"date":"2026-07-28","type":"Cardio","strength":[],"cardio":[{"exercise":"Zone 2","duration_min":47.6,"distance_km":3.95}],"note":null},{"date":"2026-07-31","type":"Cardio","strength":[],"cardio":[{"exercise":"Running","duration_min":31.3,"distance_km":3,"incline_level":1,"calories_kcal":196}],"note":null},{"date":"2026-08-01","type":"Cardio","strength":[],"cardio":[{"exercise":"Zone 2","duration_min":51.8,"distance_km":5.15,"incline_level":3,"avg_hr_bpm":140,"calories_kcal":330}],"note":null}]};/*WORKOUT_DATA_END*/
/*REWARDS_DATA_START*/window.REWARDS_DATA={"redemptions":[],"grants":[{"id":"special:2026-08-01-launch","granted_on":"2026-08-01","reason":"炸雞系統上線 & 本週完成 3 次訓練"}]};/*REWARDS_DATA_END*/
</script>

<!-- 指標邏輯由 build 從 dashboard-monkey.html 的 metrics 區塊複製進來(規則只有一份來源,
     這裡不自己寫一份達標判定)。註解裡不要寫出完整的 script 標籤——會害掃描用的正則抓錯位置。 -->
<script id="metricsSlot">/*METRICS_START*/
"use strict";
(function (w) {
  const WEEKLY_GOAL = { runs: 3, minutes: 150 };
  // 炸雞券從這一週開始核發,更早的達標週不回溯。
  const REWARD_START_WEEK = "2026-07-27";

  // 一天算一次 run:同日多筆 cardio 合併(距離相加、時間相加)。
  // 資料必須完整(date / duration_min / distance_km),殘缺的丟進 invalid,不靜默略過。
  function buildDayRuns(sessions) {
    const byDate = new Map();
    const invalid = [];
    (sessions || []).forEach((s) => {
      const date = s && s.date;
      (s && s.cardio ? s.cardio : []).forEach((c) => {
        const min = c && c.duration_min;
        const km = c && c.distance_km;
        const okMin = typeof min === "number" && isFinite(min) && min > 0;
        const okKm = typeof km === "number" && isFinite(km) && km > 0;
        if (!date || !okMin || !okKm) {
          invalid.push({
            date: date || "(no date)",
            reason: !date ? "missing date" : !okKm ? "missing distance_km" : "missing duration_min",
          });
          return;
        }
        const cur = byDate.get(date) || { date: date, km: 0, min: 0 };
        cur.km += km;
        cur.min += min;
        byDate.set(date, cur);
      });
    });
    const runs = [...byDate.values()]
      .map((r) => ({ date: r.date, km: Math.round(r.km * 100) / 100, min: r.min }))
      .sort((a, b) => a.date.localeCompare(b.date));
    return { runs: runs, invalid: invalid };
  }

  // 配速 min/km -> "m:ss"
  function formatPace(p) {
    if (typeof p !== "number" || !isFinite(p) || p <= 0) return "—";
    const mm = Math.floor(p);
    const ss = Math.round((p - mm) * 60);
    return ss === 60 ? mm + 1 + ":00" : mm + ":" + String(ss).padStart(2, "0");
  }

  const DAY = 86400000;
  const toDate = (s) => new Date(s + "T00:00:00");
  const toStr = (d) =>
    d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  // 週一為一週之始
  function weekStart(dateStr) {
    const d = toDate(dateStr);
    const back = (d.getDay() + 6) % 7; // 週一 = 0
    d.setDate(d.getDate() - back);
    return toStr(d);
  }
  function addDays(dateStr, n) {
    const d = toDate(dateStr);
    d.setDate(d.getDate() + n);
    return toStr(d);
  }

  function weekAgg(dayRuns) {
    const map = new Map();
    dayRuns.forEach((r) => {
      const k = weekStart(r.date);
      const cur = map.get(k) || { runs: 0, km: 0, min: 0 };
      cur.runs += 1;
      cur.km += r.km;
      cur.min += r.min;
      map.set(k, cur);
    });
    return map;
  }

  const isCompleteWeek = (a) => !!a && a.runs >= WEEKLY_GOAL.runs && a.min >= WEEKLY_GOAL.minutes;

  function currentQuest(dayRuns, todayStr) {
    const ws = weekStart(todayStr);
    const a = weekAgg(dayRuns).get(ws) || { runs: 0, km: 0, min: 0 };
    const runsPct = Math.min(1, a.runs / WEEKLY_GOAL.runs);
    const minutesPct = Math.min(1, a.min / WEEKLY_GOAL.minutes);
    const weekEnd = addDays(ws, 6);
    const daysLeft = Math.round((toDate(weekEnd) - toDate(todayStr)) / DAY) + 1;
    return {
      weekStart: ws,
      weekEnd: weekEnd,
      runs: a.runs,
      minutes: a.min,
      km: Math.round(a.km * 100) / 100,
      runsPct: runsPct,
      minutesPct: minutesPct,
      questPct: (runsPct + minutesPct) / 2,
      complete: isCompleteWeek(a),
      daysLeft: Math.max(0, daysLeft),
    };
  }

  // 連續達標週。本週還沒結束 -> 未達標不算斷,已達標則計入。
  function streak(dayRuns, todayStr) {
    const agg = weekAgg(dayRuns);
    let cursor = weekStart(todayStr);
    let n = 0;
    if (isCompleteWeek(agg.get(cursor))) n += 1;
    cursor = addDays(cursor, -7);
    while (isCompleteWeek(agg.get(cursor))) {
      n += 1;
      cursor = addDays(cursor, -7);
    }
    return n;
  }

  // 一週達標 = 一張炸雞券(kind "quest"),每週上限一張,完全由訓練資料推導、不存。
  //
  // 另有一種券:手動核發的特別券(kind "special",grants ledger)。它是人做的決定、
  // 本來就推導不出來,所以必須存——這不是「存推導值」,而是把唯一的事實來源落地。
  //
  // 兩種券共用主鍵 `id`:達標券 "quest:<week_start>",特別券用 grant 自己的 id。
  // 特別券不綁週,所以同一週既可以有達標券、也可以有特別券,不會互相蓋掉。
  //
  // 對不上的使用紀錄/發券紀錄一律進 problems 讓 build 擋下來——已經吃掉的炸雞不能無聲消失。
  function coupons(dayRuns, redemptions, grants) {
    const byWeek = new Map();
    dayRuns.forEach((r) => {
      const k = weekStart(r.date);
      const arr = byWeek.get(k) || [];
      arr.push(r);
      byWeek.set(k, arr);
    });

    // 取得日 = 兩項條件同時滿足的那一天,所以要依日期逐次累加,不能只看整週總和。
    const earned = new Map();
    byWeek.forEach((rs, ws) => {
      if (ws < REWARD_START_WEEK) return;
      let runs = 0;
      let min = 0;
      let on = null;
      rs.slice()
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach((r) => {
          runs += 1;
          min += r.min;
          if (!on && isCompleteWeek({ runs: runs, min: min })) on = r.date;
        });
      if (on) earned.set(ws, on);
    });

    const problems = [];
    const issued = new Map();
    [...earned.keys()].sort().forEach((ws) => {
      issued.set("quest:" + ws, {
        id: "quest:" + ws,
        kind: "quest",
        week_start: ws,
        week_end: addDays(ws, 6),
        earned_on: earned.get(ws),
        reason: null,
      });
    });

    (grants || []).forEach((g) => {
      const id = g && g.id;
      const on = g && g.granted_on;
      const why = g && g.reason;
      if (!id || !on || !why) {
        problems.push({ id: id || "(no id)", week_start: null, reason: "grant missing id, granted_on or reason" });
      } else if (id.indexOf("quest:") === 0) {
        // 讓特別券冒充達標券會讓兩者永遠分不開,也可能蓋掉真的達標券
        problems.push({ id: id, week_start: null, reason: "grant id must not start with \"quest:\"" });
      } else if (issued.has(id)) {
        problems.push({ id: id, week_start: null, reason: "duplicate grant id" });
      } else {
        issued.set(id, {
          id: id,
          kind: "special",
          week_start: null,
          week_end: null,
          earned_on: on,
          reason: why,
        });
      }
    });

    const used = new Map();
    (redemptions || []).forEach((x) => {
      // 舊格式只有 week_start;ledger 目前是空的,但留著對應以免舊紀錄被無聲丟掉
      const id = (x && x.id) || (x && x.week_start ? "quest:" + x.week_start : null);
      const ws = (x && x.week_start) || null;
      const on = x && x.used_on;
      if (!id || !on) {
        problems.push({ id: id || "(no id)", week_start: ws, reason: "missing id or used_on" });
      } else if (!issued.has(id)) {
        problems.push({ id: id, week_start: ws, reason: "no such coupon" });
      } else if (used.has(id)) {
        problems.push({ id: id, week_start: ws, reason: "coupon used twice" });
      } else if (on < issued.get(id).earned_on) {
        problems.push({ id: id, week_start: ws, reason: "used on " + on + " but earned on " + issued.get(id).earned_on });
      } else {
        used.set(id, x);
      }
    });

    // 新的在前,票券夾直接照這個順序畫。同一天取得的用 id 決定順序,避免順序隨機。
    const list = [...issued.values()]
      .sort((a, b) => (a.earned_on === b.earned_on ? b.id.localeCompare(a.id) : b.earned_on.localeCompare(a.earned_on)))
      .map((c) => {
        const u = used.get(c.id);
        return {
          id: c.id,
          kind: c.kind,
          week_start: c.week_start,
          week_end: c.week_end,
          earned_on: c.earned_on,
          reason: c.reason,
          status: u ? "used" : "available",
          used_on: u ? u.used_on : null,
          note: u && u.note != null ? u.note : null,
        };
      });

    return {
      coupons: list,
      available: list.filter((c) => c.status === "available").length,
      used: list.filter((c) => c.status === "used").length,
      problems: problems,
    };
  }

  // 短跑很容易刷出漂亮配速,設距離門檻擋掉,否則 PR 榜會被一次 1 km 衝刺永久霸榜。
  const MIN_PR_KM = 2;
  const paceOf = (r) => r.min / r.km;

  function personalRecords(dayRuns) {
    if (!dayRuns.length) {
      return {
        fastestPace: null, longestRun: null, longestTime: null,
        isNew: { fastestPace: false, longestRun: false, longestTime: false },
      };
    }
    const lastDate = dayRuns[dayRuns.length - 1].date;
    // dayRuns 已依日期升冪;用嚴格大於/小於比較,平手時保留較早的那筆,不會誤觸發 NEW
    let fp = null, lr = null, lt = null;
    dayRuns.forEach((r) => {
      if (r.km >= MIN_PR_KM && (!fp || paceOf(r) < fp.pace)) fp = { pace: paceOf(r), date: r.date, km: r.km };
      if (!lr || r.km > lr.km) lr = { km: r.km, date: r.date };
      if (!lt || r.min > lt.min) lt = { min: r.min, date: r.date };
    });
    return {
      fastestPace: fp,
      longestRun: lr,
      longestTime: lt,
      isNew: {
        fastestPace: !!fp && fp.date === lastDate,
        longestRun: !!lr && lr.date === lastDate,
        longestTime: !!lt && lt.date === lastDate,
      },
    };
  }

  // 最近 5 次的加權平均配速(Σmin / Σkm)。用累積平均的話後期會鈍化,跑再快也推不動數字。
  // deltaSec 與「前 5 次」比較,正值 = 變快。
  function avgPace(dayRuns) {
    const wavg = (arr) => {
      const km = arr.reduce((a, r) => a + r.km, 0);
      const min = arr.reduce((a, r) => a + r.min, 0);
      return km > 0 ? min / km : null;
    };
    const last5 = dayRuns.slice(-5);
    const prev5 = dayRuns.slice(-10, -5);
    const pace = last5.length ? wavg(last5) : null;
    const prev = prev5.length === 5 ? wavg(prev5) : null;
    return {
      pace: pace,
      deltaSec: pace != null && prev != null ? (prev - pace) * 60 : null,
      sampleSize: last5.length,
    };
  }

  function weeklyDistance(dayRuns, todayStr, n) {
    n = n || 8;
    const agg = weekAgg(dayRuns);
    const cur = weekStart(todayStr);
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const ws = addDays(cur, -7 * i);
      const a = agg.get(ws);
      out.push({ weekStart: ws, km: a ? Math.round(a.km * 10) / 10 : 0, isCurrent: i === 0 });
    }
    return out;
  }

  const heatmapLevel = (km) => (km <= 0 ? 0 : km <= 3 ? 1 : km <= 6 ? 2 : 3);

  // 熱力圖的唯一產生器:把 [fromDate..toDate] 切成一欄一週(週一~週日)。
  // 區間外(首尾那兩欄的邊角)與今天之後的格子都是 null,畫成透明格。
  // RECENT 與各年份 tab 共用它——規則只有一份,不會偷偷分岔。
  function heatmapRange(dayRuns, fromDate, toDate, todayStr) {
    const byDate = new Map(dayRuns.map((r) => [r.date, r]));
    const lastWeek = weekStart(toDate);
    const weeks = [];
    let totalRuns = 0;
    for (let ws = weekStart(fromDate); ws <= lastWeek; ws = addDays(ws, 7)) {
      const col = [];
      for (let d = 0; d < 7; d++) {
        const date = addDays(ws, d);
        if (date < fromDate || date > toDate || date > todayStr) { col.push(null); continue; }
        const r = byDate.get(date);
        const km = r ? r.km : 0;
        if (r) totalRuns += 1;
        col.push({ date: date, km: km, level: heatmapLevel(km) });
      }
      weeks.push(col);
    }
    return { weeks: weeks, totalRuns: totalRuns, firstDate: fromDate };
  }

  // RECENT:過去 365 天(含今天)。365 = 52 週 + 1 天 -> 53 欄,首欄不完整。
  const HEATMAP_DAYS = 365;
  function heatmap(dayRuns, todayStr) {
    return heatmapRange(dayRuns, addDays(todayStr, -(HEATMAP_DAYS - 1)), todayStr, todayStr);
  }

  // 日曆年:1/1 ~ 12/31。當年還沒過完的話,今天之後的格子是空的。
  function heatmapYear(dayRuns, year, todayStr) {
    return heatmapRange(dayRuns, year + "-01-01", year + "-12-31", todayStr);
  }

  // tab 用的年份清單:最早有資料的年份 ~ 今年,連續列出(中間空白年份也列,否則 tab 會跳號)。
  // 今年之後的年份不列——未來日期的資料不該生出未來的 tab。
  function heatmapYears(dayRuns, todayStr) {
    const thisYear = Number(todayStr.slice(0, 4));
    const first = dayRuns.reduce(
      (min, r) => Math.min(min, Number(r.date.slice(0, 4))), thisYear);
    const out = [];
    for (let y = thisYear; y >= first; y--) out.push(y);
    return out;
  }

  // ---- 睡眠與用藥 -----------------------------------------------------------
  // 一晚一檔的事實紀錄:那晚吃沒吃、躺床區間、主觀品質。
  // 減藥計畫「不存」(它隨睡眠狀況變動,存了就會腐化),所以這裡沒有任何
  // 「今晚該不該吃」的判定——集章卡只講發生過的事,不講計畫。
  const STAMP_NIGHTS = 14;

  const isDateStr = (s) =>
    typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && toStr(toDate(s)) === s;

  // "HH:MM" -> 當日分鐘數。格式不合回 null,由呼叫端決定怎麼處理。
  function parseClock(s) {
    const m = typeof s === "string" && s.match(/^([01]\d|2[0-3]):([0-5]\d)$/);
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }

  // 躺床時數。wake <= bed 視為跨過午夜。
  // 這是睡眠長度的近似而已:入睡花了多久沒有記錄,所以它一定略高於真正睡著的
  // 時數——頁面上不要叫它「睡眠時數」。
  function timeInBed(night) {
    const bed = parseClock(night && night.bedtime);
    const wake = parseClock(night && night.wake_time);
    if (bed == null || wake == null) return null;
    return ((wake <= bed ? wake + 1440 : wake) - bed) / 60;
  }

  function formatHours(h) {
    if (typeof h !== "number" || !isFinite(h) || h < 0) return "—";
    const total = Math.round(h * 60);
    return Math.floor(total / 60) + "h" + String(total % 60).padStart(2, "0");
  }

  const nightsByDate = (nights) => {
    const m = new Map();
    (nights || []).forEach((n) => { if (n && isDateStr(n.date)) m.set(n.date, n); });
    return m;
  };

  const nightOn = (nights, dateStr) => nightsByDate(nights).get(dateStr) || null;

  // 集章卡:昨天往回數 count 晚(含昨天),最右一格是昨晚。
  //
  // 今晚不佔格子。那筆要明天早上醒來才填得完(躺床時數、品質、昏沉都得睡完才
  // 知道),擺一格在那裡永遠是空的,「沒記錄」這個訊號就沒意義了。
  function sleepStamps(nights, todayStr, count) {
    const n = count || STAMP_NIGHTS;
    const byDate = nightsByDate(nights);
    const out = [];
    for (let i = n; i >= 1; i--) {
      const date = addDays(todayStr, -i);
      const rec = byDate.get(date) || null;
      out.push({
        date: date,
        state: !rec ? "none" : rec.medication && rec.medication.taken ? "taken" : "skipped",
        night: rec,
      });
    }
    return out;
  }

  // 卡片底部那一行。沒記錄回 null,頁面顯示「還沒記」。
  const lastNight = (nights, todayStr) => nightOn(nights, addDays(todayStr, -1));

  // 睡眠紀錄的驗證。壞資料不能入庫:必填缺一不可,格式不對就報錯。
  // 回傳 problems 陣列(空 = 沒問題),由 build 決定要不要 exit 1。
  //
  // 「有沒有漏記」刻意不在這裡檢查。漏記是要被看見的事實,不是要被擋下的錯誤
  // ——漏兩晚就讓 build 掛掉,只會逼人去編假資料填洞。缺的那晚在集章卡上就是
  // 一個空格,自己會說話。
  function validateNights(entries, todayStr) {
    const problems = [];
    const seen = new Set();
    const isInt = (v) => typeof v === "number" && isFinite(v) && Math.floor(v) === v;
    (entries || []).forEach((e) => {
      const file = (e && e.file) || "(unknown file)";
      const n = e && e.data;
      const add = (reason) => problems.push({ file: file, reason: reason });
      if (!n || typeof n !== "object" || Array.isArray(n)) { add("內容不是一個物件"); return; }

      const named = /^(\d{4}-\d{2}-\d{2})\.json$/.exec(String(file).replace(/^.*[\\/]/, ""));
      if (!named || !isDateStr(named[1])) add("檔名不是合法的 YYYY-MM-DD.json");

      if (!isDateStr(n.date)) {
        add("date 缺漏或不是合法的 YYYY-MM-DD");
      } else {
        if (named && named[1] !== n.date) add("檔名日期與 date(" + n.date + ")不一致");
        if (todayStr && n.date > todayStr) add("date(" + n.date + ")晚於今天");
        if (seen.has(n.date)) add("date(" + n.date + ")重複");
        seen.add(n.date);
      }

      // 那一晚吃了沒是必答題。省略等於允許「我不確定」混進資料裡。
      const med = n.medication;
      if (!med || typeof med !== "object" || typeof med.taken !== "boolean") {
        add("medication.taken 缺漏或不是 true/false");
      }
      if (parseClock(n.bedtime) == null) add("bedtime 缺漏或不是 HH:MM");
      if (parseClock(n.wake_time) == null) add("wake_time 缺漏或不是 HH:MM");
      if (!isInt(n.quality) || n.quality < 1 || n.quality > 5) add("quality 必須是 1–5 的整數");
      if (typeof n.morning_grogginess !== "boolean") add("morning_grogginess 缺漏或不是 true/false");
      if (n.night_wakes != null && (!isInt(n.night_wakes) || n.night_wakes < 0)) {
        add("night_wakes 必須是 ≥ 0 的整數");
      }
      if (n.note != null && typeof n.note !== "string") add("note 必須是字串或 null");
    });
    return problems;
  }

  w.MonkeyMetrics = {
    WEEKLY_GOAL: WEEKLY_GOAL,
    REWARD_START_WEEK: REWARD_START_WEEK,
    MIN_PR_KM: MIN_PR_KM,
    weeklyDistance: weeklyDistance,
    heatmapLevel: heatmapLevel,
    HEATMAP_DAYS: HEATMAP_DAYS,
    heatmapRange: heatmapRange,
    heatmap: heatmap,
    heatmapYear: heatmapYear,
    heatmapYears: heatmapYears,
    buildDayRuns: buildDayRuns,
    formatPace: formatPace,
    weekStart: weekStart,
    addDays: addDays,
    weekAgg: weekAgg,
    isCompleteWeek: isCompleteWeek,
    currentQuest: currentQuest,
    streak: streak,
    coupons: coupons,
    personalRecords: personalRecords,
    avgPace: avgPace,
    STAMP_NIGHTS: STAMP_NIGHTS,
    parseClock: parseClock,
    timeInBed: timeInBed,
    formatHours: formatHours,
    nightOn: nightOn,
    sleepStamps: sleepStamps,
    lastNight: lastNight,
    validateNights: validateNights,
  };
})(typeof window !== "undefined" ? window : this);
/*METRICS_END*/</script>

<script id="render">
"use strict";
(function () {
  const M = window.MonkeyMetrics;
  const el = (id) => document.getElementById(id);

  if (!M) {
    el("dataErrors").innerHTML =
      "<b>BUILD ERROR</b> — metrics 區塊沒有注入,請執行 node scripts/build_dashboard.js Monkey";
    return;
  }

  const dr = M.buildDayRuns((window.WORKOUT_DATA || {}).sessions);
  const RW = window.REWARDS_DATA || {};
  const wallet = M.coupons(dr.runs, RW.redemptions || [], RW.grants || []);
  const available = wallet.coupons.filter((c) => c.status === "available");
  const used = wallet.coupons.filter((c) => c.status === "used");

  // 真實今天(本地時區)。今天拿到的券會發光,隔天就安靜。
  const now = new Date();
  const TODAY = now.getFullYear() + "-" +
    String(now.getMonth() + 1).padStart(2, "0") + "-" +
    String(now.getDate()).padStart(2, "0");

  // 這次瀏覽中被「用掉」的券。純演出——ledger 沒動,重新整理就回到可用。
  // 真正生效要由 Captain 跑 use-coupon,下次部署後才是真的。
  const pending = new Set();

  // 兩個清單都要把 pending 算進去,否則會出現「USED 1」但點進去是空的。
  // 這樣頁面內自洽,看起來也跟之後真的寫進 ledger、重新部署完全一樣。
  const availList = () => available.filter((c) => !pending.has(c.id));
  const usedList = () => used.concat(available.filter((c) => pending.has(c.id)));

  function renderTotals() {
    el("totals").innerHTML =
      '<span class="num lime" style="font-size:13px">' + wallet.coupons.length + "</span> EARNED · " +
      '<span class="num lime" style="font-size:13px">' + availList().length + "</span> AVAILABLE · " +
      '<span class="num" style="font-size:13px">' + usedList().length + "</span> USED";
  }

  const VIEWS = [
    { key: "available", label: "AVAILABLE", list: availList,
      empty: () => usedList().length ? "All coupons used — go earn another one" :
        "No coupons yet — complete a weekly quest to earn one" },
    { key: "used", label: "USED", list: usedList, empty: () => "Nothing used yet" },
  ];

  function renderTabs(active) {
    el("tabs").innerHTML = VIEWS.map((v) =>
      '<button class="tab' + (v.key === active ? " on" : "") + '" data-view="' + v.key + '">' +
        v.label + " " + v.list().length + "</button>").join("");
  }

  // note 是人寫的自由文字,直接塞進 HTML 會被標籤字元弄壞版面
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

  // 核發理由只留在 grants.json 裡當稽核用,不畫在券上
  const row = (c) => {
    const spent = pending.has(c.id);
    const isUsed = c.status === "used" || spent;
    const stamp = spent ? TODAY.slice(5) : c.status === "used" ? c.used_on.slice(5) : null;
    return '<div class="cpn' + (isUsed ? " used" : " tapable") +
      (c.kind === "special" ? " special" : "") +
      // 今天拿到、還沒用掉的券才發光
      (!isUsed && c.earned_on === TODAY ? " fresh" : "") + '" data-id="' + esc(c.id) + '">' +
      '<div class="stub">🍗</div>' +
      '<div class="body"><span class="lbl">EARNED</span>' +
        '<span class="num" style="font-size:13px">' + c.earned_on + "</span>" +
        (c.note ? '<span class="note">' + esc(c.note) + "</span>" : "") +
      "</div>" +
      // 徽章要放在 .body 外面:.body 有 overflow:hidden,長 note 會把徽章擠出去而被裁掉
      (c.kind === "special" ? '<span class="badge">SPECIAL</span>' : "") +
      // 可用的券不放戳記元素:opacity:0 仍然佔寬度,會把日期擠到被裁掉。
      // 要用的時候再由 spend() 建立。
      (isUsed ? '<div class="stamp">USED ' + stamp + "</div>" : "") +
    "</div>";
  };

  let currentView = "available";
  function render(key) {
    currentView = key;
    const v = VIEWS.find((x) => x.key === key);
    const list = v.list();
    el("list").innerHTML = list.length
      ? '<div class="cpnList">' + list.map(row).join("") + "</div>"
      : '<div id="empty">' + v.empty() + "</div>";
  }

  // 點券 -> 就地確認 -> 蓋章。這一段全是演出,不寫任何資料。
  function ask(node, onYes) {
    if (node.querySelector(".ask")) return;
    const box = document.createElement("div");
    box.className = "ask";
    box.innerHTML = '<span>USE?</span><button class="yes">✓</button><button class="no">✗</button>';
    node.appendChild(box);
    box.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      e.stopPropagation();
      box.remove();
      if (b.classList.contains("yes")) onYes();
    });
  }

  function spend(node) {
    node.classList.remove("fresh", "tapable");
    const stamp = document.createElement("div");
    stamp.className = "stamp";
    stamp.textContent = "USED " + TODAY.slice(5);
    stamp.style.opacity = 0;
    node.appendChild(stamp);
    void node.offsetWidth;
    node.classList.add("go");
    setTimeout(() => {
      node.classList.add("used");
      // 戳記的最終狀態自己設,不靠 animation-fill-mode——使用者若關掉動態效果,
      // 動畫整個不跑,戳記就永遠不會出現。
      stamp.style.opacity = 1;
      pending.add(node.dataset.id);
      renderTotals();
      renderTabs(currentView);
    }, 234);
  }

  el("list").addEventListener("click", (e) => {
    const node = e.target.closest(".cpn.tapable");
    if (node) ask(node, () => spend(node));
  });

  el("tabs").addEventListener("click", (e) => {
    const b = e.target.closest(".tab");
    if (!b) return;
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
    render(b.dataset.view);
  });

  renderTotals();
  renderTabs("available");
  render("available");

  // 資料有問題不靜默略過(build 已經會擋,這是最後一道)
  const errs = [];
  if (dr.invalid.length) {
    errs.push("<b>DATA ERROR</b> — " + dr.invalid.length + " incomplete record(s): " +
      dr.invalid.map((v) => v.date + " (" + v.reason + ")").join(", "));
  }
  if (wallet.problems.length) {
    errs.push("<b>COUPON ERROR</b> — " +
      wallet.problems.map((p) => p.id + " (" + p.reason + ")").join(", "));
  }
  if (errs.length) el("dataErrors").innerHTML = errs.join("<br />");
})();
</script>
</body>
