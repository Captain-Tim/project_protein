<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 加到主畫面(只做 iOS,不支援 Android,所以沒有 manifest)。狀態列用不透明的 black,
     black-translucent 會讓內容鑽到狀態列底下,把 header 壓掉。 -->
<link rel="apple-touch-icon" href="icons/monkey-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Monkey" />
<meta name="theme-color" content="#070708" />
<title>Monkey — Tanoi</title>
<style>
  @property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  :root {
    --bg: #070708; --card: #111214; --border: #212328;
    --ink: #e9ecef; --muted: #7f858e;
    --accent: #c9f24d; --accent-dim: #7fae35;
    --person: #ff3b3b;
    --streak: #ffb648; --streak-bg: #1a1408; --streak-border: #4a3a12;
    --star: #ffc93c; --star-off: #4a4d55;               /* 睡眠品質星等:實星黃、空星壓暗 */
    --pos: #34d399; --neg: #f87171;                     /* 漲跌:▲ 進步=綠、▼ 退步=紅 */
    --hm0: #17191c; --hm1: #2f4419; --hm2: #5f8a26; --hm3: #c9f24d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; min-width: 0; }
  .row { display: flex; gap: 12px; }
  .lbl { font-size: 10px; letter-spacing: 1.1px; color: var(--muted); font-weight: 600; }
  .num { font-family: Consolas, ui-monospace, monospace; font-weight: 700; }
  .lime { color: var(--accent); }
  /* 趨勢差值:箭頭已代表「進步/退步」(▲=配速更快),故 ▲ 綠 / ▼ 紅。
     掛在它描述的那個主數值底下,自己佔一行,所以要 block——inline 吃不到 margin-top */
  .delta { display: block; font-size: 10px; margin-top: 5px; }
  .delta.up { color: var(--pos); }
  .delta.down { color: var(--neg); }
  .delta.flat { color: var(--muted); }

  header.hero {
    --ava: 62px;
    display: flex; align-items: center; gap: 14px;
    background: radial-gradient(600px 120px at 8% -30%, rgba(255, 59, 59, .25), transparent), #0d0e10;
    border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px;
  }
  /* 頭像:光暈脈動(呼吸),點下去放大看原圖。
     hover 放大掛在外層容器上,生日帽才會跟著一起放大——留在 img 上會變成頭像動、帽子不動 */
  .avaWrap { position: relative; display: inline-block; line-height: 0; flex: 0 0 auto;
    transition: transform .15s; }
  .avaWrap:hover { transform: scale(1.06); }
  .avatar { width: var(--ava); height: var(--ava); border-radius: 50%; display: block; object-fit: cover;
    border: 2px solid var(--person); cursor: zoom-in;
    animation: avatarPulse 2.2s ease-in-out infinite; }
  /* 生日帽:平常 hidden,只有生日當天由 render 拿掉。尺寸與位移全部從 --ava 算出來,
     桌機 62px 與手機 52px 共用同一組算式,改頭像大小不用重調帽子 */
  .bhat { position: absolute; left: 0; top: 0;
    width: calc(var(--ava) * .51); font-size: calc(var(--ava) * .4692);
    line-height: 1; text-align: center; pointer-events: none;
    transform-origin: 60% 100%;
    transform: translateY(calc(var(--ava) * -.30)) rotate(-40deg); }
  @keyframes avatarPulse {
    0%, 100% { box-shadow: 0 0 13px rgba(255, 59, 59, .35); }
    50%      { box-shadow: 0 0 19px rgba(255, 59, 59, .8); }
  }
  @media (prefers-reduced-motion: reduce) {
    .avatar { animation: none; box-shadow: 0 0 16px rgba(255, 59, 59, .5); }
  }

  /* 放大檢視 */
  #lightbox { position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(4, 4, 5, .88); backdrop-filter: blur(6px); cursor: zoom-out; }
  #lightbox.on { display: flex; }
  #lightbox img { max-width: min(90vw, 640px); max-height: 86vh; border-radius: 18px;
    border: 2px solid var(--person); box-shadow: 0 0 60px rgba(255, 59, 59, .45);
    animation: lbIn .18s ease-out; }
  @keyframes lbIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  #lightbox .close { position: absolute; top: 18px; right: 22px; font-size: 26px; line-height: 1;
    color: var(--muted); background: none; border: 0; cursor: pointer; font-family: inherit; }
  #lightbox .close:hover { color: var(--ink); }

  /* 熱力圖某日詳情小卡:點有紀錄的格子跳出,後方頁面模糊 */
  #dayModal { position: fixed; inset: 0; z-index: 110; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(4, 4, 5, .72); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
  #dayModal.on { display: flex; }
  #dayModal .dc { position: relative; width: min(92vw, 430px); max-height: 84vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px 20px 22px; box-shadow: 0 24px 64px rgba(0, 0, 0, .6); animation: lbIn .18s ease-out; }
  #dayModal .dc .close { position: absolute; top: 12px; right: 14px; font-size: 20px; line-height: 1;
    color: var(--muted); background: none; border: 0; cursor: pointer; font-family: inherit; }
  #dayModal .dc .close:hover { color: var(--ink); }
  .dcDate { font-family: Consolas, ui-monospace, monospace; font-weight: 800; font-size: 21px; letter-spacing: .5px; }
  .dcWk { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .dcTypes { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 2px; }
  .dcType { font-size: 10px; font-weight: 700; letter-spacing: .6px; padding: 3px 9px; border-radius: 99px;
    color: var(--accent); border: 1px solid var(--accent-dim); background: rgba(255, 255, 255, .02); }
  .dcSec { margin-top: 15px; }
  .dcSecT { font-size: 10px; letter-spacing: 1.1px; color: var(--ink); font-weight: 700; margin-bottom: 6px; }
  .dcEx { padding: 9px 0; border-top: 1px solid var(--border); }
  .dcEx:first-of-type { border-top: 0; }
  .dcExName { font-size: 13px; font-weight: 700; }
  .dcSets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .dcSet { font-family: Consolas, ui-monospace, monospace; font-size: 11px; color: var(--ink);
    padding: 2px 7px; border-radius: 6px; background: rgba(255, 255, 255, .04); border: 1px solid var(--border); }
  .dcMeta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 6px; }
  .dcMeta > div { display: flex; align-items: baseline; gap: 4px; }
  .dcMeta b { font-family: Consolas, ui-monospace, monospace; color: var(--accent); font-weight: 800; font-size: 15px; }
  .dcMeta span { color: var(--muted); font-size: 10px; letter-spacing: .5px; }
  .dcNote { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.55; white-space: pre-wrap; }
  .dcNoteMain { font-size: 12px; color: var(--ink); margin-top: 6px; line-height: 1.6; white-space: pre-wrap; }
  .hmGrid i[data-date] { cursor: pointer; }
  .hmGrid i[data-date]:hover { outline: 1.5px solid var(--hm3); outline-offset: 1px; }

  .who { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
  .who i { color: var(--person); font-style: normal; }
  .streak { margin-left: auto; display: flex; align-items: center; gap: 8px;
    background: var(--streak-bg); border: 1px solid var(--streak-border); border-radius: 999px; padding: 7px 14px; }
  .streak .n { font-size: 20px; font-weight: 800; color: var(--streak); font-family: Consolas, monospace; }
  /* 連續 0 週:整個徽章熄掉。燒著的火焰配一個 0 太矛盾,只灰火焰又跟橘色數字打架 */
  .streak.zero { background: transparent; border-color: var(--border); }
  .streak.zero .n { color: var(--muted); }
  .streak.zero .flame { filter: grayscale(1); opacity: .45; }

  /* 卡片外的區塊標題,字級與卡片裡的標題(ACTIVITY、SLEEP)同一套 */
  /* TRAINING LOG 卡:PR 榜、WEEKLY DISTANCE 與 LAST WORKOUT 都是它的子區塊。
     子區塊刻意不再是卡片——卡中卡會出現兩種深度的盒子並排,很吵。改用細線分段。
     唯一保留邊框的內層是 .pr 統計磚:NEW 的流動光弧畫在邊框上,沒有邊框就沒有它。 */
  .tlSub { font-size: 11px; font-weight: 800; letter-spacing: .9px; color: var(--ink); }
  .tlSect { margin-top: 11px; }
  .tlSect + .tlSect { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--border); }
  /* 間距用內距而不是 gap,分隔線才會落在兩格正中間 */
  .tlRow { display: flex; gap: 0; }
  .tlRow > div { flex: 1 1 0; min-width: 0; }
  /* 分隔線掛在左邊的圖表格,不掛在 LAST WORKOUT 上——它 hover 要整圈亮起來,
     線掛在它身上會變成雙線 */
  .tlRow > .chartCell { padding-right: 22px; border-right: 1px solid var(--border);
    transition: border-color .12s; }
  .tlRow > .lwCell { padding: 6px 10px 8px 22px; border-radius: 12px; }
  /* hover:整圈用主色亮起來,把原本「整張卡邊框變色」那個提示還回來。
     用 outline 不用 border:不佔版面所以內容不會位移,而且會跟著圓角走。
     2px 而不是 1px:原本是「已經存在的邊框變色」,現在是「線從無到有」,
     同樣 1px 的線從無到有看起來明顯更細。
     上浮拿掉:沒有盒子,浮起來沒有依據。 */
  .lwCell.lw { outline: 2px solid transparent; outline-offset: -1px;
    transition: background-color .12s, outline-color .12s; }
  .lwCell.lw:hover { transform: none; background: rgba(255, 255, 255, .035);
    outline-color: var(--accent); }
  /* hover 時讓分隔線淡出:它就貼在 outline 左段外面 1px,兩條線擠在一起會很瑣碎 */
  .tlRow:has(.lwCell:hover) > .chartCell { border-right-color: transparent; }

  .ring { width: 92px; height: 92px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; }
  .ring.done { box-shadow: 0 0 18px rgba(201, 242, 77, .45); }
  .ring > div { width: 70px; height: 70px; border-radius: 50%; background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .v { font-size: 17px; font-weight: 800; font-family: Consolas, monospace; }
  .qwrap { align-items: center; }
  .qcol { display: flex; align-items: center; gap: 14px; flex: 1 1 0; min-width: 0; }
  .qsep { width: 1px; background: var(--border); align-self: stretch; }
  /* QUEST 環是前兩項的綜合,右邊沒有非重複的話可講,所以環在上、小標在下、置中 */
  .qprog { flex-direction: column; justify-content: center; gap: 8px; text-align: center; }

  /* quest 卡底部那一條:左邊是快到手的券,右邊是已經有的券。
     兩者都在講同一週的同一件事,拆成三張卡只是把一句話切成三段。 */
  .qfoot { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  /* 票券夾入口:只給張數,券的清單在 wallet-monkey.html */
  #wallet { display: block; text-decoration: none; color: inherit; text-align: right; }
  #wallet .wrow { display: flex; justify-content: flex-end; align-items: baseline; gap: 10px; }
  #wallet .go { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--accent); }
  #wallet:hover .go { text-decoration: underline; }
  /* 下一張券還差多少。quest 卡講 runs/minutes,這裡把它翻成獎勵的語言 */
  #nextCoupon .line { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  #nextCoupon .v { font-size: 15px; font-weight: 800; }
  /* 小雞在字尾左右擺,填掉右邊的空白。純旋轉不位移,所以卡片高度一點都不變 */
  @keyframes chickWaddle {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(7deg); }
  }
  #nextCoupon .chick { font-size: 17px; line-height: 1; display: inline-block;
    animation: chickWaddle .79s ease-in-out infinite; }
  #nextCoupon.done .v { color: var(--accent); }
  /* 達標之後:雞腿發光,兩側的星星交錯閃 */
  @keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(.8); }
    50%      { opacity: 1; transform: scale(1.15); }
  }
  #nextCoupon .joy { display: flex; align-items: center; gap: 4px; }
  #nextCoupon .joy .d { font-size: 20px; line-height: 1;
    filter: drop-shadow(0 0 7px rgba(201, 242, 77, .8)); }
  #nextCoupon .joy .s { font-size: 12px; line-height: 1; display: inline-block;
    animation: twinkle 1.4s ease-in-out infinite; }
  #nextCoupon .joy .s:last-child { animation-delay: .63s; }
  @media (prefers-reduced-motion: reduce) {
    #nextCoupon .chick, #nextCoupon .joy .s { animation: none; }
  }

  .pr { flex: 1 1 0; min-width: 0; text-align: center; padding: 16px 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; position: relative; }
  .pr.new { border-color: var(--accent); box-shadow: 0 0 18px rgba(201, 242, 77, .28); }
  /* NEW 紀錄卡:一段光弧繞邊框流動(漸層流動邊框) */
  .pr.new::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    pointer-events: none;
    background: conic-gradient(from var(--ang), transparent 0 55%, var(--accent) 72%,
      #fff 80%, var(--accent) 88%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    filter: drop-shadow(0 0 5px var(--accent))
            drop-shadow(0 0 14px rgba(201, 242, 77, .35));
    animation: flowSpin 5.1s linear infinite; }
  @keyframes flowSpin { to { --ang: 360deg; } }
  @media (prefers-reduced-motion: reduce) { .pr.new::before { animation: none; } }
  .pr .t { font-size: 26px; line-height: 1; }
  .pr .v { font-size: 23px; font-weight: 800; margin-top: 6px; font-family: Consolas, monospace; }
  .pr .d { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .pr .tag { position: absolute; top: -8px; right: 10px; background: var(--accent); color: #0a0a0a;
    font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 999px; letter-spacing: .5px; }

  /* 柱狀圖:柱體不填滿整格(留白,避免糊成色塊),空白週留淡軌道當位置參考 */
  /* 同一排的 LAST WORKOUT 內容較多,會把這張卡一起撐高。長條圖跟著長高填滿,
     否則底部空一截。88px 是下限,卡片不夠高時不會把長條壓扁。 */
  #weeklyDist { display: flex; flex-direction: column; }
  .bars { display: flex; align-items: flex-end; gap: 8px; flex: 1; min-height: 88px; --bw: 22px;
    border-bottom: 1px solid var(--border); }
  .bars .slot { position: relative; flex: 1 1 0; min-width: 0; height: 100%;
    display: flex; align-items: flex-end; justify-content: center; }
  .bars .slot::before { content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: var(--bw); height: 100%; border-radius: 4px 4px 0 0; background: rgba(255, 255, 255, .035); }
  .bars i { position: relative; width: var(--bw); max-width: 100%; border-radius: 4px 4px 0 0;
    display: block; min-height: 2px; background: transparent; }
  .bars i.on { background: linear-gradient(180deg, var(--accent), var(--accent-dim)); }
  .bars i.on.cur { box-shadow: 0 0 9px rgba(201, 242, 77, .4); }
  .barx { display: flex; gap: 8px; font-size: 9px; color: var(--muted); margin-top: 6px; }
  .barx span { flex: 1 1 0; min-width: 0; text-align: center; }

  /* 最近一次訓練:整張卡可點,開的是熱力圖那個當日詳情彈窗。
     桌機只有約 300px 寬(比彈窗還窄),所以字級以窄欄為基準,手機再放大回去。 */
  .lw { display: block; text-decoration: none; color: inherit; cursor: pointer;
    transition: border-color .12s, transform .12s; }
  .lw:hover { border-color: var(--accent-dim); transform: translateY(-1px); }
  .lwHead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  /* 距今天數的三段號誌。綠用 --pos 不用主色:萊姆綠在這頁到處都是,當燈號會失去對比 */
  .lwAgo.fresh { color: var(--pos); }
  .lwAgo.warn { color: var(--streak); }
  .lwAgo.stale { color: var(--neg); }
  .lwName { font-size: 16px; font-weight: 800; letter-spacing: .3px; margin-top: 8px; line-height: 1.35; }
  .lwDate { font-family: Consolas, ui-monospace, monospace; font-size: 11px; color: var(--muted); margin-top: 1px; }
  /* 三個主數值均分撐滿。這張卡比彈窗寬,沿用 .dcMeta 的靠左 gap 會在右側空一塊 */
  .lwStats { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
  .lwStats > div { flex: 1 1 0; min-width: 0; }
  .lwStats .v { font-family: Consolas, ui-monospace, monospace; font-weight: 800;
    font-size: 20px; color: var(--accent); line-height: 1.15; }
  /* 選配欄位維持靠左排,與彈窗的 .dcMeta 同一套。只有主數值均分,層次才不會被拉平。
     這一段不畫分隔線:卡片扁平化之後它上下已經各有一條,中間再一條就是三條等距橫線
     擠在一屏,讀起來像三個並列區塊,其實只是一張卡。改用加大的留白分段。 */
  .lwExtra { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .lwExtra > div { display: flex; align-items: baseline; gap: 4px; }
  .lwExtra b { font-family: Consolas, ui-monospace, monospace; color: var(--ink); font-weight: 800; font-size: 13px; }
  .lwExtra span { color: var(--muted); font-size: 10px; letter-spacing: .5px; }
  /* 破紀錄標籤跟在項目名後面,窄欄放不下就換行,不縮字也不截斷 */
  .lwPR { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 800;
    letter-spacing: .4px; color: #0d0e10; background: var(--accent); border-radius: 99px;
    padding: 2px 7px; margin-left: 6px; vertical-align: 2px; }
  .lwFoot { display: flex; justify-content: flex-end; margin-top: 10px; }
  .lwGo { font-size: 10px; font-weight: 700; letter-spacing: .8px; color: var(--accent); }
  .lw:hover .lwGo { text-decoration: underline; }

  /* 熱力圖:一年 53 欄放不進手機,自己在容器內橫向捲動,捲軸配合頁面改成細螢光綠 */
  .hmScroll { overflow-x: auto; padding-bottom: 10px; flex: 1 1 auto; min-width: 0;
    scrollbar-width: thin; scrollbar-color: var(--accent) #15171a; }
  .hmScroll::-webkit-scrollbar { height: 7px; }
  .hmScroll::-webkit-scrollbar-track { background: #15171a; border-radius: 99px; }
  .hmScroll::-webkit-scrollbar-thumb { background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 99px; box-shadow: 0 0 7px rgba(201, 242, 77, .5); }
  /* 星期標籤放在捲動容器「外面」的獨立一欄,否則捲到最右時它會跟著消失 */
  .hmBody { display: flex; gap: 6px; align-items: flex-start; }
  .hmDays { display: grid; grid-template-rows: repeat(7, 13px); gap: 4px; font-size: 9px; color: var(--muted);
    flex: 0 0 auto; margin-top: 19px; }
  .hmDays span { display: flex; align-items: center; height: 13px; }
  .hmGrid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 4px; }
  .hmGrid i { width: 13px; height: 13px; border-radius: 3px; display: block; background: var(--hm0); }
  .hmGrid i.l1 { background: var(--hm1); }
  .hmGrid i.l2 { background: var(--hm2); }
  .hmGrid i.l3 { background: var(--hm3); box-shadow: 0 0 7px rgba(201, 242, 77, .45); }
  .hmGrid i.empty { background: transparent; }
  .hmMon { display: grid; grid-auto-flow: column; gap: 4px; font-size: 9px; color: var(--muted);
    margin-bottom: 5px; }
  .hmLegend { display: flex; align-items: center; gap: 6px; font-size: 9px; color: var(--muted);
    margin-top: 12px; justify-content: flex-end; }
  .hmLegend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  /* 年份切換:窄螢幕時整列往下換行,不去擠壓標題 */
  .hmTabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .hmTab { font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
    padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); transition: color .15s, border-color .15s, box-shadow .15s; }
  .hmTab:hover { color: var(--ink); border-color: var(--accent-dim); }
  .hmTab.on { color: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 12px rgba(201, 242, 77, .25); }

  #dataErrors { margin-top: 24px; font-size: 12px; color: #ff8a8a;
    border: 1px solid #4a1414; background: #1a0c0c; border-radius: 12px; padding: 10px 14px; }
  #dataErrors:empty { display: none; }

  #tip { position: fixed; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .08s;
    background: #1a1c20; color: var(--ink); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 9px; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.55); }
  [data-tip] { cursor: pointer; }

  /* 集章卡:一晚一格,最右是昨晚。三態——蓋章(吃了)/ 空心點(沒吃)/ 虛線框(沒記錄)。
     沒記錄刻意畫成空格而不是第三種顏色,缺口要看起來像缺口。 */
  .stamps { display: flex; flex-wrap: wrap; gap: 8px; }
  .stamp { width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto; cursor: pointer;
    position: relative; display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1;
    border: 1px solid var(--border); background: #17191c; transition: transform .12s, border-color .12s; }
  .stamp:hover { transform: translateY(-2px); border-color: var(--accent-dim); }
  .stamp.taken { background: var(--streak-bg); border-color: var(--streak-border); }
  /* 沒吃 = 同一顆膠囊灰掉再打紅叉。跟「沒記錄」的空格一眼分得開:
     一個是「有這回事,但沒吃」,一個是「不知道」。 */
  .stamp.skipped .pill { opacity: .45; filter: grayscale(.75); }
  .stamp.skipped::after { content: "✕"; position: absolute; right: 2px; bottom: 1px;
    color: var(--neg); font-weight: 800; font-size: 12px; line-height: 1;
    text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .stamp.none { background: transparent; border-style: dashed; border-color: #2b2e34; }
  /* 亮邊標的是「底下那行正在講哪一晚」,所以跟著滑鼠走,沒滑就回到昨晚 */
  .stamp.sel { box-shadow: 0 0 0 2px var(--accent-dim); }
  /* 星等要蓋掉繼承來的顏色(.lbl 的灰、.dcMeta b 的萊姆綠),所以自己帶 color */
  .stars { color: var(--star); letter-spacing: 1.5px; }
  .stars .off { color: var(--star-off); }
  /* 彈窗裡 .dcMeta span 的 specificity 比 .stars 高,會把顏色跟字級一起吃掉。
     這條是為了搶回來,不是重複——刪掉星星就會變回灰色的 10px。 */
  .dcMeta .stars { color: var(--star); font-size: inherit; }
  .stampFoot { margin-top: 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .stampFoot .v { font-family: Consolas, ui-monospace, monospace; font-weight: 800; font-size: 15px; }

  @media (max-width: 640px) {
    .wrap { padding: 12px 12px 48px; }
    header.hero { --ava: 52px; gap: 12px; padding: 12px 14px; flex-wrap: wrap; }
    .who { font-size: 17px; }
    .streak { margin-left: 0; width: 100%; justify-content: center; margin-top: 10px; }
    .row { flex-direction: column; }

    /* 三個 quest 環在手機仍並排(縮小),讓一屏內還看得到 PR 榜。
       各欄文字行數不同,改成頂端對齊,否則環會被推得高低參差 */
    .qwrap { flex-direction: row !important; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
    .qcol { flex-direction: column; gap: 8px; text-align: center; }
    .qsep { display: none; }
    /* 底部那條在手機折成上下兩塊,票券夾就不該再靠右——兩塊要對齊同一條左邊界 */
    .qfoot { flex-direction: column; align-items: stretch; gap: 12px; }
    #wallet { text-align: left; }
    #wallet .wrow { justify-content: flex-start; }
    .ring { width: 84px; height: 84px; }
    .ring > div { width: 64px; height: 64px; }

    #prBoard { flex-direction: row !important; gap: 8px; }
    .pr { padding: 12px 4px; }
    .pr .t { font-size: 20px; }
    .pr .v { font-size: 17px; }
    .pr .d { font-size: 9px; }
    .pr .tag { right: 4px; }
    .pr .lbl { letter-spacing: .3px; }

    /* 手機順序:LAST WORKOUT 排在 WEEKLY DISTANCE 之前。最近一次比八週趨勢即時,
       一屏看得到的東西少,即時的排前面。
       DOM 順序沒變(WEEKLY DISTANCE 在前),所以分隔線要從圖表格的右邊換到上邊,
       不然那條線會出現在整個區塊的最上面。 */
    .tlRow { flex-direction: column; gap: 14px; }
    .tlRow > .lwCell { order: -1; padding: 6px 0 8px; }
    .tlRow > .chartCell { padding-right: 0; border-right: 0;
      padding-top: 13px; border-top: 1px solid var(--border); }
    /* 手機是全寬,不再是窄欄,字級放大回來 */
    .lwName { font-size: 19px; }
    .lwStats { gap: 22px; }
    .lwStats .v { font-size: 24px; }
    .delta { font-size: 11px; }
    /* 兩張卡在手機各自獨立、不再等高,長條圖回到固定高度。
       min-height 要一起歸零,否則桌機那條 88px 會把 74px 頂上去 */
    .bars { flex: none; min-height: 0; height: 74px; gap: 5px; --bw: 16px; }
    .barx { gap: 5px; }
  }
</style>

<script id="metrics">
"use strict";
(function (w) {
  const WEEKLY_GOAL = { runs: 3, minutes: 150 };
  // 炸雞券從這一週開始核發,更早的達標週不回溯。
  const REWARD_START_WEEK = "2026-07-27";

  // 一天算一次 run:同日多筆 cardio 合併(距離相加、時間相加)。
  // 資料必須完整(date / duration_min / distance_km),殘缺的丟進 invalid,不靜默略過。
  function buildDayRuns(sessions) {
    const byDate = new Map();
    const invalid = [];
    (sessions || []).forEach((s) => {
      const date = s && s.date;
      (s && s.cardio ? s.cardio : []).forEach((c) => {
        const min = c && c.duration_min;
        const km = c && c.distance_km;
        const okMin = typeof min === "number" && isFinite(min) && min > 0;
        const okKm = typeof km === "number" && isFinite(km) && km > 0;
        if (!date || !okMin || !okKm) {
          invalid.push({
            date: date || "(no date)",
            reason: !date ? "missing date" : !okKm ? "missing distance_km" : "missing duration_min",
          });
          return;
        }
        const cur = byDate.get(date) || { date: date, km: 0, min: 0 };
        cur.km += km;
        cur.min += min;
        byDate.set(date, cur);
      });
    });
    const runs = [...byDate.values()]
      .map((r) => ({ date: r.date, km: Math.round(r.km * 100) / 100, min: r.min }))
      .sort((a, b) => a.date.localeCompare(b.date));
    return { runs: runs, invalid: invalid };
  }

  // 配速 min/km -> "m:ss"
  function formatPace(p) {
    if (typeof p !== "number" || !isFinite(p) || p <= 0) return "—";
    const mm = Math.floor(p);
    const ss = Math.round((p - mm) * 60);
    return ss === 60 ? mm + 1 + ":00" : mm + ":" + String(ss).padStart(2, "0");
  }

  const DAY = 86400000;
  const toDate = (s) => new Date(s + "T00:00:00");
  const toStr = (d) =>
    d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  // 週一為一週之始
  function weekStart(dateStr) {
    const d = toDate(dateStr);
    const back = (d.getDay() + 6) % 7; // 週一 = 0
    d.setDate(d.getDate() - back);
    return toStr(d);
  }
  function addDays(dateStr, n) {
    const d = toDate(dateStr);
    d.setDate(d.getDate() + n);
    return toStr(d);
  }

  function weekAgg(dayRuns) {
    const map = new Map();
    dayRuns.forEach((r) => {
      const k = weekStart(r.date);
      const cur = map.get(k) || { runs: 0, km: 0, min: 0 };
      cur.runs += 1;
      cur.km += r.km;
      cur.min += r.min;
      map.set(k, cur);
    });
    return map;
  }

  const isCompleteWeek = (a) => !!a && a.runs >= WEEKLY_GOAL.runs && a.min >= WEEKLY_GOAL.minutes;

  function currentQuest(dayRuns, todayStr) {
    const ws = weekStart(todayStr);
    const a = weekAgg(dayRuns).get(ws) || { runs: 0, km: 0, min: 0 };
    const runsPct = Math.min(1, a.runs / WEEKLY_GOAL.runs);
    const minutesPct = Math.min(1, a.min / WEEKLY_GOAL.minutes);
    const weekEnd = addDays(ws, 6);
    const daysLeft = Math.round((toDate(weekEnd) - toDate(todayStr)) / DAY) + 1;
    return {
      weekStart: ws,
      weekEnd: weekEnd,
      runs: a.runs,
      minutes: a.min,
      km: Math.round(a.km * 100) / 100,
      runsPct: runsPct,
      minutesPct: minutesPct,
      questPct: (runsPct + minutesPct) / 2,
      complete: isCompleteWeek(a),
      daysLeft: Math.max(0, daysLeft),
    };
  }

  // 連續達標週。本週還沒結束 -> 未達標不算斷,已達標則計入。
  function streak(dayRuns, todayStr) {
    const agg = weekAgg(dayRuns);
    let cursor = weekStart(todayStr);
    let n = 0;
    if (isCompleteWeek(agg.get(cursor))) n += 1;
    cursor = addDays(cursor, -7);
    while (isCompleteWeek(agg.get(cursor))) {
      n += 1;
      cursor = addDays(cursor, -7);
    }
    return n;
  }

  // 一週達標 = 一張炸雞券(kind "quest"),每週上限一張,完全由訓練資料推導、不存。
  //
  // 另有一種券:手動核發的特別券(kind "special",grants ledger)。它是人做的決定、
  // 本來就推導不出來,所以必須存——這不是「存推導值」,而是把唯一的事實來源落地。
  //
  // 兩種券共用主鍵 `id`:達標券 "quest:<week_start>",特別券用 grant 自己的 id。
  // 特別券不綁週,所以同一週既可以有達標券、也可以有特別券,不會互相蓋掉。
  //
  // 對不上的使用紀錄/發券紀錄一律進 problems 讓 build 擋下來——已經吃掉的炸雞不能無聲消失。
  function coupons(dayRuns, redemptions, grants) {
    const byWeek = new Map();
    dayRuns.forEach((r) => {
      const k = weekStart(r.date);
      const arr = byWeek.get(k) || [];
      arr.push(r);
      byWeek.set(k, arr);
    });

    // 取得日 = 兩項條件同時滿足的那一天,所以要依日期逐次累加,不能只看整週總和。
    const earned = new Map();
    byWeek.forEach((rs, ws) => {
      if (ws < REWARD_START_WEEK) return;
      let runs = 0;
      let min = 0;
      let on = null;
      rs.slice()
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach((r) => {
          runs += 1;
          min += r.min;
          if (!on && isCompleteWeek({ runs: runs, min: min })) on = r.date;
        });
      if (on) earned.set(ws, on);
    });

    const problems = [];
    const issued = new Map();
    [...earned.keys()].sort().forEach((ws) => {
      issued.set("quest:" + ws, {
        id: "quest:" + ws,
        kind: "quest",
        week_start: ws,
        week_end: addDays(ws, 6),
        earned_on: earned.get(ws),
        reason: null,
      });
    });

    (grants || []).forEach((g) => {
      const id = g && g.id;
      const on = g && g.granted_on;
      const why = g && g.reason;
      if (!id || !on || !why) {
        problems.push({ id: id || "(no id)", week_start: null, reason: "grant missing id, granted_on or reason" });
      } else if (id.indexOf("quest:") === 0) {
        // 讓特別券冒充達標券會讓兩者永遠分不開,也可能蓋掉真的達標券
        problems.push({ id: id, week_start: null, reason: "grant id must not start with \"quest:\"" });
      } else if (issued.has(id)) {
        problems.push({ id: id, week_start: null, reason: "duplicate grant id" });
      } else {
        issued.set(id, {
          id: id,
          kind: "special",
          week_start: null,
          week_end: null,
          earned_on: on,
          reason: why,
        });
      }
    });

    const used = new Map();
    (redemptions || []).forEach((x) => {
      // 舊格式只有 week_start;ledger 目前是空的,但留著對應以免舊紀錄被無聲丟掉
      const id = (x && x.id) || (x && x.week_start ? "quest:" + x.week_start : null);
      const ws = (x && x.week_start) || null;
      const on = x && x.used_on;
      if (!id || !on) {
        problems.push({ id: id || "(no id)", week_start: ws, reason: "missing id or used_on" });
      } else if (!issued.has(id)) {
        problems.push({ id: id, week_start: ws, reason: "no such coupon" });
      } else if (used.has(id)) {
        problems.push({ id: id, week_start: ws, reason: "coupon used twice" });
      } else if (on < issued.get(id).earned_on) {
        problems.push({ id: id, week_start: ws, reason: "used on " + on + " but earned on " + issued.get(id).earned_on });
      } else {
        used.set(id, x);
      }
    });

    // 新的在前,票券夾直接照這個順序畫。同一天取得的用 id 決定順序,避免順序隨機。
    const list = [...issued.values()]
      .sort((a, b) => (a.earned_on === b.earned_on ? b.id.localeCompare(a.id) : b.earned_on.localeCompare(a.earned_on)))
      .map((c) => {
        const u = used.get(c.id);
        return {
          id: c.id,
          kind: c.kind,
          week_start: c.week_start,
          week_end: c.week_end,
          earned_on: c.earned_on,
          reason: c.reason,
          status: u ? "used" : "available",
          used_on: u ? u.used_on : null,
          note: u && u.note != null ? u.note : null,
        };
      });

    return {
      coupons: list,
      available: list.filter((c) => c.status === "available").length,
      used: list.filter((c) => c.status === "used").length,
      problems: problems,
    };
  }

  // 短跑很容易刷出漂亮配速,設距離門檻擋掉,否則 PR 榜會被一次 1 km 衝刺永久霸榜。
  const MIN_PR_KM = 2;
  const paceOf = (r) => r.min / r.km;

  function personalRecords(dayRuns) {
    if (!dayRuns.length) {
      return {
        fastestPace: null, longestRun: null, longestTime: null,
        isNew: { fastestPace: false, longestRun: false, longestTime: false },
      };
    }
    const lastDate = dayRuns[dayRuns.length - 1].date;
    // dayRuns 已依日期升冪;用嚴格大於/小於比較,平手時保留較早的那筆,不會誤觸發 NEW
    let fp = null, lr = null, lt = null;
    dayRuns.forEach((r) => {
      if (r.km >= MIN_PR_KM && (!fp || paceOf(r) < fp.pace)) fp = { pace: paceOf(r), date: r.date, km: r.km };
      if (!lr || r.km > lr.km) lr = { km: r.km, date: r.date };
      if (!lt || r.min > lt.min) lt = { min: r.min, date: r.date };
    });
    return {
      fastestPace: fp,
      longestRun: lr,
      longestTime: lt,
      isNew: {
        fastestPace: !!fp && fp.date === lastDate,
        longestRun: !!lr && lr.date === lastDate,
        longestTime: !!lt && lt.date === lastDate,
      },
    };
  }

  // 最近一個「訓練日」的彙總。buildDayRuns 只掃 cardio,純重訓日不在它的輸出裡,
  // 所以這裡自己掃 sessions——不然只做重訓的那天會被跳過,卡片報的是更早的日子。
  // 同一天多筆一律合併,與 streak / quest / PR 榜的「一天算一次」同一套語彙。
  function lastWorkout(sessions) {
    const dates = [...new Set((sessions || []).map((s) => s && s.date).filter(Boolean))].sort();
    if (!dates.length) return null;
    const date = dates[dates.length - 1];
    const day = (sessions || []).filter((s) => s && s.date === date);
    const cardio = day.reduce((a, s) => a.concat(s.cardio || []), []);
    const strength = day.reduce((a, s) => a.concat(s.strength || []), []);
    // 只有一筆 cardio 時才有單一的心率/坡度/卡路里可講。兩筆以上心率不能相加、
    // 坡度不能平均,硬湊出來的數字沒有意義,寧可整欄不顯示。
    const only = cardio.length === 1 ? cardio[0] : {};
    return {
      date: date,
      kind: cardio.length ? "cardio" : "strength",
      names: [...new Set(cardio.length ? cardio.map((c) => c.exercise) : day.map((s) => s.type))],
      km: Math.round(cardio.reduce((a, c) => a + (c.distance_km || 0), 0) * 100) / 100,
      min: Math.round(cardio.reduce((a, c) => a + (c.duration_min || 0), 0) * 10) / 10,
      // 坡度 0 是有效的實測值,所以看欄位在不在,不要看值真不真
      hr: only.avg_hr_bpm,
      incline: only.incline_level,
      kcal: only.calories_kcal,
      exCount: strength.length,
      setCount: strength.reduce((a, e) => a + (e.sets || []).length, 0),
      exNames: strength.map((e) => e.exercise),
    };
  }

  // beforeDate 之前最近一個「有 cardio」的訓練日,給 ▲▼ 當比較基準。
  // 純重訓日跳過:那些日子沒有距離與配速可比。
  function prevCardioDay(sessions, beforeDate) {
    const byDate = new Map();
    (sessions || []).forEach((s) => {
      if (!s || !s.date || s.date >= beforeDate) return;
      (s.cardio || []).forEach((c) => {
        const cur = byDate.get(s.date) || { date: s.date, km: 0, min: 0 };
        cur.km += c.distance_km || 0;
        cur.min += c.duration_min || 0;
        byDate.set(s.date, cur);
      });
    });
    const dates = [...byDate.keys()].sort();
    if (!dates.length) return null;
    const d = byDate.get(dates[dates.length - 1]);
    return { date: d.date, km: Math.round(d.km * 100) / 100, min: Math.round(d.min * 10) / 10 };
  }

  function weeklyDistance(dayRuns, todayStr, n) {
    n = n || 8;
    const agg = weekAgg(dayRuns);
    const cur = weekStart(todayStr);
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const ws = addDays(cur, -7 * i);
      const a = agg.get(ws);
      out.push({ weekStart: ws, km: a ? Math.round(a.km * 10) / 10 : 0, isCurrent: i === 0 });
    }
    return out;
  }

  const heatmapLevel = (km) => (km <= 0 ? 0 : km <= 3 ? 1 : km <= 6 ? 2 : 3);

  // 熱力圖的唯一產生器:把 [fromDate..toDate] 切成一欄一週(週一~週日)。
  // 區間外(首尾那兩欄的邊角)與今天之後的格子都是 null,畫成透明格。
  // RECENT 與各年份 tab 共用它——規則只有一份,不會偷偷分岔。
  function heatmapRange(dayRuns, fromDate, toDate, todayStr) {
    const byDate = new Map(dayRuns.map((r) => [r.date, r]));
    const lastWeek = weekStart(toDate);
    const weeks = [];
    let totalRuns = 0;
    for (let ws = weekStart(fromDate); ws <= lastWeek; ws = addDays(ws, 7)) {
      const col = [];
      for (let d = 0; d < 7; d++) {
        const date = addDays(ws, d);
        if (date < fromDate || date > toDate || date > todayStr) { col.push(null); continue; }
        const r = byDate.get(date);
        const km = r ? r.km : 0;
        if (r) totalRuns += 1;
        col.push({ date: date, km: km, level: heatmapLevel(km) });
      }
      weeks.push(col);
    }
    return { weeks: weeks, totalRuns: totalRuns, firstDate: fromDate };
  }

  // RECENT:過去 365 天(含今天)。365 = 52 週 + 1 天 -> 53 欄,首欄不完整。
  const HEATMAP_DAYS = 365;
  function heatmap(dayRuns, todayStr) {
    return heatmapRange(dayRuns, addDays(todayStr, -(HEATMAP_DAYS - 1)), todayStr, todayStr);
  }

  // 日曆年:1/1 ~ 12/31。當年還沒過完的話,今天之後的格子是空的。
  function heatmapYear(dayRuns, year, todayStr) {
    return heatmapRange(dayRuns, year + "-01-01", year + "-12-31", todayStr);
  }

  // tab 用的年份清單:最早有資料的年份 ~ 今年,連續列出(中間空白年份也列,否則 tab 會跳號)。
  // 今年之後的年份不列——未來日期的資料不該生出未來的 tab。
  function heatmapYears(dayRuns, todayStr) {
    const thisYear = Number(todayStr.slice(0, 4));
    const first = dayRuns.reduce(
      (min, r) => Math.min(min, Number(r.date.slice(0, 4))), thisYear);
    const out = [];
    for (let y = thisYear; y >= first; y--) out.push(y);
    return out;
  }

  // ---- 睡眠與用藥 -----------------------------------------------------------
  // 一晚一檔的事實紀錄:那晚吃沒吃、躺床區間、主觀品質。
  // 減藥計畫「不存」(它隨睡眠狀況變動,存了就會腐化),所以這裡沒有任何
  // 「今晚該不該吃」的判定——集章卡只講發生過的事,不講計畫。
  const STAMP_NIGHTS = 14;

  // 早上起來的狀態,三階,由差到好。彈窗直接把值轉大寫顯示。
  const MORNING_STATES = ["groggy", "normal", "clear"];

  const isDateStr = (s) =>
    typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && toStr(toDate(s)) === s;

  // "HH:MM" -> 當日分鐘數。格式不合回 null,由呼叫端決定怎麼處理。
  function parseClock(s) {
    const m = typeof s === "string" && s.match(/^([01]\d|2[0-3]):([0-5]\d)$/);
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }

  // 躺床時數。wake <= bed 視為跨過午夜。
  // 這是睡眠長度的近似而已:入睡花了多久沒有記錄,所以它一定略高於真正睡著的
  // 時數——頁面上不要叫它「睡眠時數」。
  function timeInBed(night) {
    const bed = parseClock(night && night.bedtime);
    const wake = parseClock(night && night.wake_time);
    if (bed == null || wake == null) return null;
    return ((wake <= bed ? wake + 1440 : wake) - bed) / 60;
  }

  function formatHours(h) {
    if (typeof h !== "number" || !isFinite(h) || h < 0) return "—";
    const total = Math.round(h * 60);
    return Math.floor(total / 60) + "h" + String(total % 60).padStart(2, "0");
  }

  const nightsByDate = (nights) => {
    const m = new Map();
    (nights || []).forEach((n) => { if (n && isDateStr(n.date)) m.set(n.date, n); });
    return m;
  };

  const nightOn = (nights, dateStr) => nightsByDate(nights).get(dateStr) || null;

  // 集章卡:從「開始記錄那晚」畫到昨晚,最多 count 格。
  //
  // 今晚不佔格子。那筆要明天早上醒來才填得完(躺床時數、品質、昏沉都得睡完才
  // 知道),擺一格在那裡永遠是空的,「沒記錄」這個訊號就沒意義了。
  //
  // 開始記錄之前的日子也不畫。那時候還沒有這套東西,畫出來會長得跟漏記一模一樣
  // ——而範圍內的空格是真的漏記、是要被看見的訊號,不能被這種假空格稀釋。
  function sleepStamps(nights, todayStr, count) {
    const n = count || STAMP_NIGHTS;
    const byDate = nightsByDate(nights);
    if (!byDate.size) return [];
    const earliest = [...byDate.keys()].sort()[0];
    const yesterday = addDays(todayStr, -1);
    let cursor = addDays(todayStr, -n);
    if (cursor < earliest) cursor = earliest;
    const out = [];
    while (cursor <= yesterday) {
      const rec = byDate.get(cursor) || null;
      out.push({
        date: cursor,
        state: !rec ? "none" : rec.medication && rec.medication.taken ? "taken" : "skipped",
        night: rec,
      });
      cursor = addDays(cursor, 1);
    }
    return out;
  }

  // 卡片底部那一行。沒記錄回 null,頁面顯示「還沒記」。
  const lastNight = (nights, todayStr) => nightOn(nights, addDays(todayStr, -1));

  // 睡眠紀錄的驗證。壞資料不能入庫:必填缺一不可,格式不對就報錯。
  // 回傳 problems 陣列(空 = 沒問題),由 build 決定要不要 exit 1。
  //
  // 「有沒有漏記」刻意不在這裡檢查。漏記是要被看見的事實,不是要被擋下的錯誤
  // ——漏兩晚就讓 build 掛掉,只會逼人去編假資料填洞。缺的那晚在集章卡上就是
  // 一個空格,自己會說話。
  function validateNights(entries, todayStr) {
    const problems = [];
    const seen = new Set();
    const isInt = (v) => typeof v === "number" && isFinite(v) && Math.floor(v) === v;
    (entries || []).forEach((e) => {
      const file = (e && e.file) || "(unknown file)";
      const n = e && e.data;
      const add = (reason) => problems.push({ file: file, reason: reason });
      if (!n || typeof n !== "object" || Array.isArray(n)) { add("內容不是一個物件"); return; }

      const named = /^(\d{4}-\d{2}-\d{2})\.json$/.exec(String(file).replace(/^.*[\\/]/, ""));
      if (!named || !isDateStr(named[1])) add("檔名不是合法的 YYYY-MM-DD.json");

      if (!isDateStr(n.date)) {
        add("date 缺漏或不是合法的 YYYY-MM-DD");
      } else {
        if (named && named[1] !== n.date) add("檔名日期與 date(" + n.date + ")不一致");
        if (todayStr && n.date > todayStr) add("date(" + n.date + ")晚於今天");
        if (seen.has(n.date)) add("date(" + n.date + ")重複");
        seen.add(n.date);
      }

      // 那一晚吃了沒是必答題。省略等於允許「我不確定」混進資料裡。
      const med = n.medication;
      if (!med || typeof med !== "object" || typeof med.taken !== "boolean") {
        add("medication.taken 缺漏或不是 true/false");
      }
      if (parseClock(n.bedtime) == null) add("bedtime 缺漏或不是 HH:MM");
      if (parseClock(n.wake_time) == null) add("wake_time 缺漏或不是 HH:MM");
      if (!isInt(n.quality) || n.quality < 1 || n.quality > 5) add("quality 必須是 1–5 的整數");
      if (MORNING_STATES.indexOf(n.morning) < 0) add("morning 缺漏或不是 " + MORNING_STATES.join("/"));
      if (n.night_wakes != null && (!isInt(n.night_wakes) || n.night_wakes < 0)) {
        add("night_wakes 必須是 ≥ 0 的整數");
      }
      if (n.note != null && typeof n.note !== "string") add("note 必須是字串或 null");
    });
    return problems;
  }

  w.MonkeyMetrics = {
    WEEKLY_GOAL: WEEKLY_GOAL,
    REWARD_START_WEEK: REWARD_START_WEEK,
    MIN_PR_KM: MIN_PR_KM,
    weeklyDistance: weeklyDistance,
    heatmapLevel: heatmapLevel,
    HEATMAP_DAYS: HEATMAP_DAYS,
    heatmapRange: heatmapRange,
    heatmap: heatmap,
    heatmapYear: heatmapYear,
    heatmapYears: heatmapYears,
    buildDayRuns: buildDayRuns,
    formatPace: formatPace,
    weekStart: weekStart,
    addDays: addDays,
    weekAgg: weekAgg,
    isCompleteWeek: isCompleteWeek,
    currentQuest: currentQuest,
    streak: streak,
    coupons: coupons,
    personalRecords: personalRecords,
    lastWorkout: lastWorkout,
    prevCardioDay: prevCardioDay,
    STAMP_NIGHTS: STAMP_NIGHTS,
    MORNING_STATES: MORNING_STATES,
    parseClock: parseClock,
    timeInBed: timeInBed,
    formatHours: formatHours,
    nightOn: nightOn,
    sleepStamps: sleepStamps,
    lastNight: lastNight,
    validateNights: validateNights,
  };
})(typeof window !== "undefined" ? window : this);
</script>

<script id="render">
"use strict";
(function () {
  const M = window.MonkeyMetrics;
  const D = window.WORKOUT_DATA || { sessions: [] };
  const dr = M.buildDayRuns(D.sessions);
  const runs = dr.runs;
  const invalid = dr.invalid;

  // 真實今天(本地時區)。quest 的「本週」「剩幾天」、streak、熱力圖最右一格都以此為準。
  const now = new Date();
  const TODAY = now.getFullYear() + "-" +
    String(now.getMonth() + 1).padStart(2, "0") + "-" +
    String(now.getDate()).padStart(2, "0");

  const el = (id) => document.getElementById(id);
  const round1 = (n) => Math.round(n * 10) / 10;
  const plural = (n, word) => n + " " + word + (n === 1 ? "" : "S");

  // 生日帽:只有生日當天顯示。PROFILE_DATA 是 null 代表這個人沒設生日,永遠不顯示。
  // 用本地時區的 TODAY,人在哪個時區就照那邊的日曆過生日。
  const PF = window.PROFILE_DATA;
  if (PF && TODAY.slice(5) === PF.birthday) el("bhat").hidden = false;

  // 頁首:累積數字 + streak
  const totalKm = round1(runs.reduce((a, r) => a + r.km, 0));
  const totalMin = runs.reduce((a, r) => a + r.min, 0);
  el("totals").innerHTML =
    'TOTAL <span class="num lime" style="font-size:13px">' + totalKm + " km</span> · " +
    plural(runs.length, "RUN") + " · " + round1(totalMin / 60) + " HRS";
  const streakWeeks = M.streak(runs, TODAY);
  el("streakVal").textContent = streakWeeks;
  el("streakBadge").classList.toggle("zero", streakWeeks === 0);

  // WEEKLY QUEST
  const q = M.currentQuest(runs, TODAY);
  const G = M.WEEKLY_GOAL;
  // 弧線從 --accent-dim 沿圓弧掃到 --accent(跟 WEEKLY DISTANCE 的長條同一套配色語彙),剩下的填 --border
  // 對稱漸層:亮 → 暗 → 亮。單向漸層(暗→亮)在 100% 時,弧的起點與終點在 12 點鐘相接,
  // 最暗會直接撞上最亮而露出一道硬邊;頭尾同色就沒有這個接縫。
  const ringStyle = (pct) => {
    const p = (pct * 100).toFixed(1);
    const mid = (pct * 50).toFixed(1);
    return "background:conic-gradient(var(--accent) 0, var(--accent-dim) " + mid +
      "%, var(--accent) " + p + "%, var(--border) " + p + "% 100%)";
  };
  // 券的兩塊要畫進 quest 卡底部,所以先算好再組整張卡。
  // 達標券由 coupons() 推導;REWARDS_DATA 提供「哪張被用掉」與「手動發了哪些特別券」。
  const RW = window.REWARDS_DATA || {};
  const wallet = M.coupons(runs, RW.redemptions || [], RW.grants || []);
  const latest = wallet.coupons[0];
  const thisWeekCoupon = wallet.coupons.find((c) => c.week_start === q.weekStart);
  const gaps = [];
  if (q.runs < G.runs) gaps.push(plural(G.runs - q.runs, "MORE RUN"));
  if (q.minutes < G.minutes) gaps.push(round1(G.minutes - q.minutes) + " MIN");

  const nextCouponHTML =
    '<div id="nextCoupon"' + (thisWeekCoupon ? ' class="done"' : "") + ">" +
    (thisWeekCoupon
      ? '<div class="lbl">🍗 COUPON EARNED</div>' +
        '<div class="line"><div class="v num">' + thisWeekCoupon.earned_on + "</div>" +
        '<span class="joy"><span class="s">✨</span><span class="d">🍗</span><span class="s">✨</span></span></div>'
      : '<div class="lbl">🍗 NEXT COUPON</div>' +
        '<div class="line"><div class="v">' + (gaps.length ? gaps.join(" + ") : "—") + "</div>" +
        '<span class="chick">🐔</span></div>') +
    "</div>";

  // 只給張數,清單與 USED 歷史在 wallet-monkey.html——券會一直累積,不能佔著 dashboard
  const walletHTML =
    '<a id="wallet" href="wallet-monkey.html">' +
      '<div class="wrow">' +
        '<div class="lbl">🍗 FRIED CHICKEN WALLET</div><div class="go">VIEW WALLET ›</div></div>' +
      '<div class="num lime" style="font-size:26px;margin-top:2px">' + wallet.available +
        ' <span class="lbl" style="font-size:11px">AVAILABLE</span></div>' +
      // 一張券都沒有時才給一句提示,否則只剩一個孤零零的 0
      (latest ? "" : '<div class="lbl">Complete a weekly quest to earn your first coupon</div>') +
    "</a>";

  el("quest").innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
      '<div style="display:flex;align-items:baseline;gap:8px">' +
        '<b style="font-size:13px">WEEKLY QUEST</b>' +
        '<span class="lbl">' + q.weekStart + " → " + q.weekEnd + "</span></div>" +
      '<div class="lbl">' + q.daysLeft + " DAY" + (q.daysLeft === 1 ? "" : "S") + " LEFT</div>" +
    "</div>" +
    '<div class="row qwrap" style="margin-top:12px">' +
      '<div class="qcol">' +
        '<div class="ring' + (q.runsPct >= 1 ? " done" : "") + '" style="' + ringStyle(q.runsPct) + '">' +
          '<div><div class="v' + (q.runsPct >= 1 ? " lime" : "") + '">' + q.runs + "/" + G.runs + "</div>" +
          '<div class="lbl" style="font-size:9px">RUNS</div></div></div>' +
        '<div><div class="lbl">RUNS · GOAL ' + G.runs + "</div>" +
          (q.runsPct >= 1
            ? '<div style="font-size:15px;font-weight:700;color:var(--accent)">✓ COMPLETE</div>'
            : '<div style="font-size:15px;font-weight:700">' + (G.runs - q.runs) + " to go</div>") +
        "</div>" +
      "</div>" +
      '<div class="qsep"></div>' +
      '<div class="qcol">' +
        '<div class="ring' + (q.minutesPct >= 1 ? " done" : "") + '" style="' + ringStyle(q.minutesPct) + '">' +
          '<div><div class="v' + (q.minutesPct >= 1 ? " lime" : "") + '">' + Math.round(q.minutesPct * 100) + "%</div>" +
          '<div class="lbl" style="font-size:9px">TIME</div></div></div>' +
        '<div><div class="lbl">TIME · GOAL ' + G.minutes + " MIN</div>" +
          // 分鐘數是浮點數加總出來的,直接印會冒出 19.30000000000001 這種殘渣
          '<div style="font-size:15px;font-weight:700"><span class="num">' + round1(q.minutes) + "</span>" +
          '<span style="color:var(--muted);font-size:12px"> / ' + G.minutes + " min</span></div>" +
          (q.minutesPct >= 1
            ? ""
            : '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + round1(G.minutes - q.minutes) + " min to go</div>") +
        "</div>" +
      "</div>" +
      '<div class="qsep"></div>' +
      '<div class="qcol qprog">' +
        '<div class="ring' + (q.complete ? " done" : "") + '" style="' + ringStyle(q.questPct) + '">' +
          '<div><div class="v' + (q.complete ? " lime" : "") + '">' + Math.round(q.questPct * 100) + "%</div>" +
          '<div class="lbl" style="font-size:9px">QUEST</div></div></div>' +
        '<div class="lbl">QUEST PROGRESS</div>' +
      "</div>" +
    "</div>" +
    '<div class="qfoot">' + nextCouponHTML + walletHTML + "</div>";

  // PR 榜
  const pr = M.personalRecords(runs);
  const prCard = (isNew, icon, value, label, date) =>
    '<div class="pr' + (isNew ? " new" : "") + '">' +
      (isNew ? '<span class="tag">NEW!</span>' : "") +
      '<div class="t">' + icon + "</div>" +
      '<div class="v' + (isNew ? " lime" : "") + '">' + value + "</div>" +
      '<div class="lbl" style="margin-top:2px">' + label + "</div>" +
      '<div class="d">' + date + "</div>" +
    "</div>";
  el("prBoard").innerHTML =
    prCard(pr.isNew.fastestPace, "⚡", pr.fastestPace ? M.formatPace(pr.fastestPace.pace) : "—",
      "FASTEST PACE /km",
      pr.fastestPace ? pr.fastestPace.date + " · " + pr.fastestPace.km + " km" : "no run ≥ " + M.MIN_PR_KM + " km") +
    prCard(pr.isNew.longestRun, "🥇", pr.longestRun ? pr.longestRun.km + " km" : "—",
      "LONGEST RUN", pr.longestRun ? pr.longestRun.date : "—") +
    prCard(pr.isNew.longestTime, "⏱️", pr.longestTime ? pr.longestTime.min + " min" : "—",
      "LONGEST TIME", pr.longestTime ? pr.longestTime.date : "—");

  // LAST WORKOUT(最近一個訓練日)
  const lw = M.lastWorkout(D.sessions);
  const WKDAY_SHORT = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  function renderLastWorkout() {
    // 一筆紀錄都沒有就整張卡不出現,WEEKLY DISTANCE 自動撐滿那一排。
    // 與 SLEEP 區塊同一個處理:空卡片講一句「還沒有紀錄」對使用者沒有幫助。
    if (!lw) { el("lastWorkout").style.display = "none"; return; }

    const days = Math.round(
      (new Date(TODAY + "T00:00:00") - new Date(lw.date + "T00:00:00")) / 86400000);
    const agoText = days === 0 ? "TODAY" : days === 1 ? "YESTERDAY" : days + " DAYS AGO";
    const agoState = days > 14 ? "stale" : days > 7 ? "warn" : "fresh";
    const d = new Date(lw.date + "T00:00:00");

    // 破紀錄標籤只在最近這天就是最後一個 cardio 日時才掛。isNew 是拿 PR 日期跟
    // buildDayRuns 最後一筆比的,最近一次若是純重訓日,兩者指的不是同一天——
    // 直接掛上去會把更早那天的 PR 貼到今天。
    const prDay = runs.length ? runs[runs.length - 1].date : null;
    const prTags = lw.date === prDay
      ? [[pr.isNew.fastestPace, "⚡"], [pr.isNew.longestRun, "🥇"], [pr.isNew.longestTime, "⏱️"]]
          .filter((x) => x[0])
          .map((x) => '<span class="lwPR">' + x[1] + " NEW PR</span>").join("")
      : "";

    // 第三個參數是掛在這個數值底下的漲跌幅,沒有就不掛
    const stat = (v, u, d) =>
      '<div><div class="v">' + v + '</div><div class="lbl">' + u + "</div>" + (d || "") + "</div>";
    let body;
    if (lw.kind === "cardio") {
      // 跟上一個有 cardio 的日子比。純重訓日沒有距離配速可比,prevCardioDay 會跳過。
      const p = M.prevCardioDay(D.sessions, lw.date);
      let kmBit = "", paceBit = "";
      if (p && p.km > 0) {
        const dk = Math.round((lw.km - p.km) * 100) / 100;
        const dsec = Math.round((p.min / p.km - lw.min / lw.km) * 60);
        // 門檻是為了擋浮點殘渣,不是為了美化
        kmBit = Math.abs(dk) < 0.01
          ? '<span class="delta flat">same distance</span>'
          : '<span class="delta ' + (dk > 0 ? "up" : "down") + '">' +
            (dk > 0 ? "▲ " : "▼ ") + Math.abs(dk) + " km</span>";
        // 不寫 faster / slower,也不寫正負號:▲▼ 與紅綠已經在講方向,
        // 而它就掛在配速底下,指涉不會歪
        paceBit = Math.abs(dsec) < 1
          ? '<span class="delta flat">same pace</span>'
          : '<span class="delta ' + (dsec > 0 ? "up" : "down") + '">' +
            (dsec > 0 ? "▲ " + dsec : "▼ " + -dsec) + " sec</span>";
      }
      body = '<div class="lwStats">' +
        stat(lw.km, "KM", kmBit) + stat(round1(lw.min), "MIN") +
        stat(fmtPace(lw.min, lw.km), "MIN / KM", paceBit) +
        "</div>";
      const extras =
        (lw.hr != null ? "<div><b>" + lw.hr + "</b><span>BPM</span></div>" : "") +
        // 坡度 0 是有效的實測值,所以看欄位在不在,不要看值真不真
        (lw.incline != null ? "<div><b>" + lw.incline + "</b><span>INCLINE</span></div>" : "") +
        (lw.kcal != null ? "<div><b>" + lw.kcal + "</b><span>KCAL</span></div>" : "");
      if (extras) body += '<div class="lwExtra">' + extras + "</div>";
    } else {
      body = '<div class="lwStats">' +
        stat(lw.exCount, plural(lw.exCount, "EXERCISE")) + stat(lw.setCount, plural(lw.setCount, "SET")) +
        "</div>";
      if (lw.exNames.length) {
        body += '<div class="lwExtra"><div><span style="font-size:11px">' +
          lw.exNames.map(escHtml).join(" · ") + "</span></div></div>";
      }
    }

    el("lastWorkout").innerHTML =
      '<div class="lwHead"><div class="tlSub">LAST WORKOUT</div>' +
        '<span class="lbl lwAgo ' + agoState + '">' + agoText + "</span></div>" +
      '<div class="lwName">' + lw.names.map(escHtml).join(" · ") + prTags + "</div>" +
      '<div class="lwDate">' + (d.getMonth() + 1) + "/" + d.getDate() +
        " (" + WKDAY_SHORT[d.getDay()] + ")</div>" +
      body +
      '<div class="lwFoot"><span class="lwGo">VIEW DETAIL ›</span></div>';

    // openDayModal 是後面才宣告的 const,在這裡直接呼叫會踩到 TDZ。
    // 包在 callback 裡,點下去才求值,那時早就宣告完了——熱力圖的綁定也是這樣。
    el("lastWorkout").addEventListener("click", () => openDayModal(lw.date));
  }

  // WEEKLY DISTANCE(最近 8 週)
  const wd = M.weeklyDistance(runs, TODAY, 8);
  const maxKm = Math.max(1, ...wd.map((x) => x.km));
  el("weeklyDist").innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
      '<div class="tlSub">WEEKLY DISTANCE</div>' +
      '<span class="lbl">THIS WEEK <span class="num lime" style="font-size:12px">' +
        wd[wd.length - 1].km + " km</span></span>" +
    "</div>" +
    '<div class="bars" style="margin-top:12px">' +
      wd.map((x) =>
        '<span class="slot" data-tip="' + x.weekStart + " · " + x.km + ' km">' +
        '<i class="' + (x.km > 0 ? "on" : "") + (x.isCurrent ? " cur" : "") + '" style="height:' +
        Math.max(2, (x.km / maxKm) * 100) + '%"></i></span>').join("") +
    "</div>" +
    '<div class="barx">' +
      wd.map((x) => "<span>" + (x.isCurrent ? "NOW" : x.weekStart.slice(5).replace("-", "/")) + "</span>").join("") +
    "</div>";

  // ACTIVITY 熱力圖:一欄一週(週一~週日)。tab 切「過去 365 天」或某個日曆年。
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const HM_YEARS = M.heatmapYears(runs, TODAY);
  const HM_COL = 17; // 13px 格子 + 4px gap,捲動定位用

  function renderActivity(view) {
    const hm = view === "recent" ? M.heatmap(runs, TODAY) : M.heatmapYear(runs, Number(view), TODAY);
    const scope = view === "recent" ? "THE PAST " + M.HEATMAP_DAYS + " DAYS" : view;

    let lastMon = -1;
    const monCells = hm.weeks.map((col, i) => {
      const first = col.find((c) => c);
      const d = new Date((first ? first.date : hm.firstDate) + "T00:00:00");
      const mo = d.getMonth();
      const show = mo !== lastMon && d.getDate() <= 7; // 該欄的第一格落在月初才標,避免月份標在月中
      if (show) lastMon = mo;
      return '<span style="grid-column:' + (i + 1) + '">' + (show ? MON[mo] : "") + "</span>";
    }).join("");

    const cells = hm.weeks.map((col) =>
      col.map((c) => c
        ? '<i class="l' + c.level + '" data-tip="' + c.date + " · " + (c.km ? c.km + " km" : "rest") + '"' + (c.km ? ' data-date="' + c.date + '"' : "") + '></i>'
        : '<i class="empty"></i>'
      ).join("")
    ).join("");

    const tabs = ["recent"].concat(HM_YEARS).map((v) => {
      const on = String(v) === String(view);
      return '<button class="hmTab' + (on ? " on" : "") + '" data-view="' + v + '" aria-pressed="' + on + '">' +
        (v === "recent" ? "RECENT" : v) + "</button>";
    }).join("");

    const gridCols = "grid-template-columns:repeat(" + hm.weeks.length + ",13px)";

    el("activity").innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">' +
        '<b style="font-size:13px">ACTIVITY</b>' +
        '<div class="hmTabs">' + tabs + "</div>" +
      "</div>" +
      '<div class="lbl" style="margin:6px 0 12px">' + plural(hm.totalRuns, "RUN") + " IN " + scope + "</div>" +
      '<div class="hmBody">' +
        '<div class="hmDays"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>' +
        '<div class="hmScroll" id="hmScroll">' +
          '<div class="hmMon" style="' + gridCols + '">' + monCells + "</div>" +
          '<div class="hmGrid" id="hmGrid" style="' + gridCols + '">' + cells + "</div>" +
        "</div>" +
      "</div>" +
      '<div class="hmLegend">LESS' +
        '<i style="background:var(--hm0)"></i><i style="background:var(--hm1)"></i>' +
        '<i style="background:var(--hm2)"></i><i style="background:var(--hm3)"></i>MORE</div>';

    // 一整年放不進手機:視圖含今天就把今天那欄捲到最右;過去年份不含今天,停在最左的一月。
    const sc = el("hmScroll");
    const todayCol = hm.weeks.findIndex((col) => col.some((c) => c && c.date === TODAY));
    sc.scrollLeft = todayCol < 0 ? 0 : Math.max(0, (todayCol + 1) * HM_COL - sc.clientWidth);
  }

  renderActivity("recent");
  el("activity").addEventListener("click", (e) => {
    const cell = e.target.closest("[data-date]");
    if (cell) { openDayModal(cell.dataset.date); return; }
    const tab = e.target.closest(".hmTab");
    if (tab) renderActivity(tab.dataset.view);
  });

  // 資料殘缺不靜默略過。券的使用紀錄對不上也一樣——build 已經會擋,這是最後一道。
  const errs = [];
  if (invalid.length) {
    errs.push("<b>DATA ERROR</b> — " + invalid.length + " incomplete record(s): " +
      invalid.map((v) => v.date + " (" + v.reason + ")").join(", "));
  }
  if (wallet.problems.length) {
    errs.push("<b>COUPON ERROR</b> — " +
      wallet.problems.map((p) => p.week_start + " (" + p.reason + ")").join(", "));
  }
  if (errs.length) el("dataErrors").innerHTML = errs.join("<br />");

  // 提示框:滑鼠 hover 即時跟著移動;觸控裝置沒有 hover,改成點一下顯示、再點別處收起
  const tip = el("tip");
  if (tip) {
    let tipEl = null;
    const placeTip = (x, y) => {
      tip.style.left = Math.min(x + 12, window.innerWidth - tip.offsetWidth - 6) + "px";
      tip.style.top = (y + 14) + "px";
    };
    const showTip = (target, x, y) => { tipEl = target; tip.textContent = target.getAttribute("data-tip"); tip.style.opacity = "1"; placeTip(x, y); };
    const hideTip = () => { tipEl = null; tip.style.opacity = "0"; };

    document.addEventListener("mouseover", (e) => { const t = e.target.closest && e.target.closest("[data-tip]"); if (t) showTip(t, e.clientX, e.clientY); });
    document.addEventListener("mousemove", (e) => { if (tipEl) placeTip(e.clientX, e.clientY); });
    document.addEventListener("mouseout", (e) => { const t = e.target.closest && e.target.closest("[data-tip]"); if (t && t === tipEl) hideTip(); });

    document.addEventListener("click", (e) => {
      const t = e.target.closest && e.target.closest("[data-tip]");
      if (!t) { hideTip(); return; }
      if (t.hasAttribute("data-date")) { hideTip(); return; }  // 有紀錄的格子交給詳情小卡
      if (t === tipEl) { hideTip(); return; }
      showTip(t, e.clientX, e.clientY);
    });
  }

  // 熱力圖某日詳情小卡:點有紀錄的格子跳出當日總覽,後方頁面模糊
  function fmtPace(min, km) {
    if (!(km > 0) || !(min > 0)) return "—";
    const p = min / km, mm = Math.floor(p), ss = Math.round((p - mm) * 60);
    return ss === 60 ? (mm + 1) + ":00" : mm + ":" + String(ss).padStart(2, "0");
  }
  const escHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function dayModalHTML(date) {
    const day = (D.sessions || []).filter((s) => s.date === date);
    const d = new Date(date + "T00:00:00");
    const WK = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const types = [...new Set(day.map((s) => s.type))];
    let h = '<div class="dc"><button class="close" data-dc-close aria-label="Close">✕</button>';
    h += '<div class="dcDate">' + (d.getMonth() + 1) + " / " + d.getDate() + "</div>";
    h += '<div class="dcWk">' + d.getFullYear() + " · " + WK[d.getDay()] + "</div>";
    h += '<div class="dcTypes">' + types.map((t) => '<span class="dcType">' + escHtml(t) + "</span>").join("") + "</div>";
    const strength = day.flatMap((s) => s.strength || []);
    const cardio = day.flatMap((s) => s.cardio || []);
    if (strength.length) {
      h += '<div class="dcSec"><div class="dcSecT">STRENGTH</div>';
      strength.forEach((ex) => {
        const u = ex.unit || "";
        h += '<div class="dcEx"><div class="dcExName">' + escHtml(ex.exercise) + "</div>";
        h += '<div class="dcSets">' + (ex.sets || []).map((st) => '<span class="dcSet">' + st.weight + u + " × " + st.reps + "</span>").join("") + "</div>";
        if (ex.note) h += '<div class="dcNote">' + escHtml(ex.note) + "</div>";
        h += "</div>";
      });
      h += "</div>";
    }
    if (cardio.length) {
      h += '<div class="dcSec"><div class="dcSecT">CARDIO</div>';
      cardio.forEach((c) => {
        h += '<div class="dcEx"><div class="dcExName">' + escHtml(c.exercise) + "</div>";
        h += '<div class="dcMeta">' +
          "<div><b>" + c.duration_min + "</b><span>MIN</span></div>" +
          "<div><b>" + c.distance_km + "</b><span>KM</span></div>" +
          "<div><b>" + fmtPace(c.duration_min, c.distance_km) + "</b><span>MIN/KM</span></div>" +
          (c.avg_hr_bpm ? "<div><b>" + c.avg_hr_bpm + "</b><span>BPM</span></div>" : "") +
          // 坡度 0 是有效的實測值,所以看欄位在不在,不要看值真不真
          (c.incline_level != null ? "<div><b>" + c.incline_level + "</b><span>INCLINE</span></div>" : "") +
          (c.calories_kcal != null ? "<div><b>" + c.calories_kcal + "</b><span>KCAL</span></div>" : "") +
        "</div>";
        if (c.note) h += '<div class="dcNote">' + escHtml(c.note) + "</div>";
        h += "</div>";
      });
      h += "</div>";
    }
    const notes = day.map((s) => s.note).filter(Boolean);
    if (notes.length) h += '<div class="dcSec"><div class="dcSecT">NOTE</div><div class="dcNoteMain">' + notes.map(escHtml).join("\n") + "</div></div>";
    return h + "</div>";
  }
  const dayModal = el("dayModal");
  const openDayModal = (date) => { if (dayModal) { dayModal.innerHTML = dayModalHTML(date); dayModal.classList.add("on"); document.body.style.overflow = "hidden"; } };
  const closeDayModal = () => { if (dayModal) { dayModal.classList.remove("on"); document.body.style.overflow = ""; } };
  if (dayModal) dayModal.addEventListener("click", (e) => { if (e.target === dayModal || (e.target.closest && e.target.closest("[data-dc-close]"))) closeDayModal(); });

  // LAST WORKOUT 的渲染在這裡才呼叫:它要用上面的 escHtml 與 fmtPace,
  // escHtml 是 const,在宣告之前呼叫會踩到 TDZ。
  renderLastWorkout();

  // ---- 睡眠集章卡 -----------------------------------------------------------
  // 一晚一格,最右是昨晚。今晚不畫格子:那筆要明天早上才填得完。
  const SLEEP = window.SLEEP_DATA || { nights: [] };
  const WKDAY = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const mdOf = (date) => Number(date.slice(5, 7)) + "/" + Number(date.slice(8, 10));
  const starsHTML = (q) =>
    '<span class="stars">' + "★".repeat(q) + '<span class="off">' + "☆".repeat(5 - q) + "</span></span>";

  function sleepModalHTML(date) {
    const n = M.nightOn(SLEEP.nights, date);
    const d = new Date(date + "T00:00:00");
    let h = '<div class="dc"><button class="close" data-dc-close aria-label="Close">✕</button>';
    h += '<div class="dcDate">' + (d.getMonth() + 1) + " / " + d.getDate() + "</div>";
    h += '<div class="dcWk">' + d.getFullYear() + " · " + WKDAY[d.getDay()] + " NIGHT</div>";
    if (!n) {
      h += '<div class="dcSec"><div class="dcSecT">NO RECORD</div>' +
        '<div class="dcNoteMain">Nothing logged for this night. It can still be filled in.</div></div>';
      return h + "</div>";
    }
    const took = !!(n.medication && n.medication.taken);
    h += '<div class="dcSec"><div class="dcSecT">' + (took ? "💊 TAKEN" : "NOT TAKEN") + "</div>";
    h += '<div class="dcMeta">' +
      "<div><b>" + starsHTML(n.quality) + "</b><span>QUALITY</span></div>" +
      "<div><b>" + M.formatHours(M.timeInBed(n)) + "</b><span>IN BED</span></div>" +
      "<div><b>" + n.bedtime + "–" + n.wake_time + "</b><span>BED–WAKE</span></div>" +
      "<div><b>" + String(n.morning).toUpperCase() + "</b><span>MORNING</span></div>" +
      (n.night_wakes != null ? "<div><b>" + n.night_wakes + "</b><span>NIGHT WAKES</span></div>" : "") +
      "</div></div>";
    if (n.note) h += '<div class="dcSec"><div class="dcSecT">NOTE</div><div class="dcNoteMain">' + escHtml(n.note) + "</div></div>";
    return h + "</div>";
  }

  function renderSleep() {
    const nights = SLEEP.nights || [];
    const stamps = M.sleepStamps(nights, TODAY);
    if (!stamps.length) return;                 // 沒有已過去的紀錄就整個 section 不出現
    const label = { taken: "TAKEN", skipped: "NOT TAKEN", none: "NOT LOGGED" };
    // 最右那格永遠是昨晚(sleepStamps 畫到昨天為止),也是底部那行的預設內容。
    const lastDate = stamps[stamps.length - 1].date;

    // 底部那一行:滑到哪一格就講哪一晚。日期是主字——吃沒吃格子的圖示已經講了,
    // 但「這是哪一天」除了點開彈窗之外沒有別的地方看得到,所以醒目的那個位置給日期。
    const footHTML = (date) => {
      const n = M.nightOn(nights, date);
      const state = n ? (n.medication && n.medication.taken ? "taken" : "skipped") : "none";
      const d = new Date(date + "T00:00:00");
      return '<span class="v">' + mdOf(date) + " (" + WKDAY[d.getDay()] + ")</span>" +
        (date === lastDate ? '<span class="lbl">LAST NIGHT ·</span>' : "") +
        '<span class="lbl">' + label[state] + "</span>" +
        (n ? '<span class="lbl">· ' + starsHTML(n.quality) +
          " · IN BED " + M.formatHours(M.timeInBed(n)) + "</span>" : "");
    };

    el("sleep").innerHTML =
      // 標題放在卡片裡、字級與 ACTIVITY 同一套,兩張卡才長得像同一個系統
      '<b style="font-size:13px;display:block;margin-bottom:12px">SLEEP</b>' +
      '<div class="stamps">' +
      stamps.map((s, i) =>
        '<div class="stamp ' + s.state + (i === stamps.length - 1 ? " sel" : "") + '"' +
        ' data-night="' + s.date + '">' + (s.state === "none" ? "" : '<span class="pill">💊</span>') + "</div>"
      ).join("") +
      "</div>" +
      '<div class="stampFoot" id="sleepFoot">' + footHTML(lastDate) + "</div>";

    el("sleep").style.display = "";

    // 滑過格子換底部那行,亮邊一起移過去,並停在最後滑過的那格——移開就跳回昨晚的話,
    // 想回頭看剛剛那晚就得再滑一次。預設是昨晚,手機沒有 hover 就一直是昨晚。
    // 格子不掛 data-tip:日期與狀態底下那行已經在講了,游標旁再講一次是同一句話說兩遍。
    const grid = el("sleep").querySelector(".stamps");
    const foot = el("sleepFoot");
    const cells = [...grid.querySelectorAll("[data-night]")];
    const select = (date) => {
      cells.forEach((c) => c.classList.toggle("sel", c.getAttribute("data-night") === date));
      foot.innerHTML = footHTML(date);
    };
    grid.addEventListener("mouseover", (e) => {
      const cell = e.target.closest && e.target.closest("[data-night]");
      if (cell) select(cell.getAttribute("data-night"));
    });

    el("sleep").addEventListener("click", (e) => {
      const cell = e.target.closest && e.target.closest("[data-night]");
      if (!cell || !dayModal) return;
      dayModal.innerHTML = sleepModalHTML(cell.getAttribute("data-night"));
      dayModal.classList.add("on");
      document.body.style.overflow = "hidden";
    });
  }
  renderSleep();

  // 頭像放大檢視:點頭像開,點背景/✕/Esc 關
  const box = el("lightbox");
  const openBox = () => { box.classList.add("on"); document.body.style.overflow = "hidden"; };
  const closeBox = () => { box.classList.remove("on"); document.body.style.overflow = ""; };
  el("avatar").addEventListener("click", openBox);
  box.addEventListener("click", closeBox);   // 點圖片本身也關(cursor 是 zoom-out,符合預期)
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeBox(); closeDayModal(); } });
})();
</script>
<script id="freshness">
// 頁面加到 iOS 主畫面之後,手機會把整份頁面存在本機,之後打開捷徑是顯示存的那一份,
// 不會回來拿新的——所以資料更新、頁面重新部署了,手機看到的還是舊畫面。這段負責讓它更新。
//
// 做法:build 會把 BUILD_ID(整份頁面內容的 hash)寫進上面的標記區塊。切回 app 時去伺服器
// 拿一份新的,只比對 BUILD_ID。不一樣就代表有新版,重載。
//
// fetch 用 cache:"reload" 而不是 "no-store":兩者都會跳過快取去拿,但只有 "reload" 會把
// 拿到的結果寫回快取。少了這一步,接下來的 location.reload() 又會從快取拿到舊頁面,
// 於是永遠重載不完。
//
// 三個頁面(dashboard-captain / dashboard-monkey / wallet-monkey)各有一份一模一樣的複本。
// 這裡沒有任何規則、只有機制,所以不走 build 複製 METRICS 那條路。
(function () {
  var MIN_GAP_MS = 30000;              // 頻繁切換 app 時不要每次都打
  var SEEN_KEY = "freshness-seen";
  var last = 0;
  var busy = false;

  function check() {
    if (!window.BUILD_ID || busy) return;
    var now = new Date().getTime();
    if (now - last < MIN_GAP_MS) return;
    last = now;
    busy = true;
    fetch(location.pathname + location.search, { cache: "reload" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (text) {
        busy = false;
        if (!text) return;
        var m = text.match(/\/\*BUILD_ID_START\*\/window\.BUILD_ID="([0-9a-f]+)"/);
        if (!m || m[1] === window.BUILD_ID) return;
        // 同一個新版本只重載一次。萬一重載後拿到的還是舊頁面(CDN 還沒更新完),
        // 沒有這道保險就會變成無限重載。
        try {
          if (sessionStorage.getItem(SEEN_KEY) === m[1]) return;
          sessionStorage.setItem(SEEN_KEY, m[1]);
        } catch (e) {}
        location.reload();
      })
      .catch(function () { busy = false; });
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") check();
  });
  // 從主畫面捷徑切回來時,iOS 有時只送 pageshow(頁面是從 bfcache 復原的)。
  window.addEventListener("pageshow", function (e) { if (e.persisted) check(); });
  // 開啟當下也檢查一次:這一次打開看到的,本來就可能是快取裡的舊頁面。
  check();
})();
</script>
